/* ============ Storage ============ */
function LS(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }
function LSset(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let customDishes = LS("frx_custom",[]);
let overrides    = LS("frx_overrides",{});
let meals        = LS("frx_meals",{});
let marks        = LS("frx_marks",{});

function ALL(){
  const base = BASE_DISHES.map(d => overrides[d.cn] ? Object.assign({,img:"img/烤羊排.jpg"},d,overrides[d.cn]) : d);
  return base.concat(customDishes);
}
function findDish(cn){ return ALL().find(d=>d.cn===cn); }
function isCustom(cn){ return customDishes.some(d=>d.cn===cn); }

/* ============ Utils ============ */
function dstr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return dstr(new Date()); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function shortDate(s){ const d=parseD(s); return (d.getMonth()+1)+"."+d.getDate()+" "+WD_EN[d.getDay()]; }
function fullDate(s){ const d=parseD(s); const isToday=(s===today()); return (isToday?"Today · ":"")+shortDate(s)+" ("+WD_CN[d.getDay()]+")"; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display="none",1800); }
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function thumbHtml(d,size=46){
  const c=CATS[d.cat]||CATS.home;
  if(d.img) return `<div class="thumb" style="width:${size}px;height:${size}px;background:#fff"><img src="${esc(d.img)}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"></div>`;
  return `<div class="thumb" style="width:${size}px;height:${size}px;background:${c.bg}">${c.icon}</div>`;
}

/* ============ App state ============ */
let tab="recipes";
let viewDate=today();
let rState={cat:"all",type:"all",spicy:"all",ben:"all",q:""};

document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  tab=b.dataset.tab; viewDate=today();
  document.querySelectorAll("#tabbar button").forEach(x=>x.classList.toggle("active",x===b));
  render();
});

function render(){
  const v=document.getElementById("view");
  if(tab==="today") v.innerHTML=viewToday();
  else if(tab==="week") v.innerHTML=viewWeek();
  else if(tab==="recipes"){ v.innerHTML=viewRecipes(); bindRecipes(); }
  else v.innerHTML=viewManage();

  const hdr=document.querySelector("header");
  if(tab==="recipes") hdr.classList.add("hidden"); else hdr.classList.remove("hidden");

  const T={today:"Meal Plan",week:"Week Plan",recipes:"Recipes",manage:"Manage"};
  const S={today:"",week:"",recipes:"",manage:""};
  document.getElementById("hTitle").textContent=T[tab];
  document.getElementById("hSub").textContent=S[tab];
}

/* ============ Today ============ */
function mealHtml(date,b){
  const m=meals[date]||{}; const arr=m[b]?m[b]:[];
  const label=b==="b"?"Breakfast":"Dinner";
  let inner;
  if(!arr.length) inner='<div class="meal-empty">No dishes planned</div>';
  else inner=arr.map(cn=>{ const d=findDish(cn); if(!d)return"";
    return `<div class="meal-item" onclick="openDetail('${esc(cn)}')">${thumbHtml(d)}
      <div class="mi-info"><div class="mi-cn">${esc(d.cn)}</div><div class="mi-en">${esc(d.en)}</div></div>
      <button class="del" onclick="event.stopPropagation();rmMeal('${date}','${b}','${esc(cn)}')">✕</button></div>`;}).join("");
  return `<div class="meal"><h3>${label}<button class="addbtn" onclick="openPicker('${date}','${b}',render)">+ Add</button></h3>${inner}</div>`;
}
function viewToday(){
  const t=viewDate;
  return `<div class="day-nav">
    <button onclick="changeDay(-1)">‹</button>
    <div class="date">${shortDate(t)}</div>
    <button onclick="changeDay(1)">›</button>
  </div>
  <div style="font-size:12px;color:var(--sub);margin:-6px 4px 10px">${fullDate(t)}</div>
  ${mealHtml(t,"b")}${mealHtml(t,"d")}`;
}
function changeDay(n){
  const d=parseD(viewDate); d.setDate(d.getDate()+n); viewDate=dstr(d); render();
}
function rmMeal(date,b,cn){
  const m=meals[date]||{b:[],d:[]}; m[b]=(m[b]||[]).filter(x=>x!==cn);
  meals[date]=m; LSset("frx_meals",meals); render();
}
function addMeal(date,b,cn){
  const m=meals[date]||{b:[],d:[]};
  if((m[b]||[]).includes(cn)){ toast("Already added"); return; }
  m[b]=m[b]||[]; m[b].push(cn); meals[date]=m; LSset("frx_meals",meals); render(); toast("Added");
}

/* ============ Week ============ */
function viewWeek(){
  let rows=""; const now=new Date();
  for(let i=0;i<7;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
    const s=dstr(d); const m=meals[s]||{};
    const b=(m.b||[]).map(cn=>{const x=findDish(cn);return x?x.cn:cn}).join("、")||"—";
    const dn=(m.d||[]).map(cn=>{const x=findDish(cn);return x?x.cn:cn}).join("、")||"—";
    rows+=`<div class="week-row"><div class="week-day week-day-cell ${i===0?"today":""}" onclick="openDaySheet('${s}')">
      <div class="wd-name">${i===0?"Today":WD_CN[d.getDay()]}</div><div class="wd-date">${d.getMonth()+1}/${d.getDate()}</div></div>
      <div class="week-meals week-day-cell" onclick="openDaySheet('${s}')">
        <div class="wm"><b>B</b><span>${esc(b)}</span></div>
        <div class="wm"><b>D</b><span>${esc(dn)}</span></div>
      </div></div>`;
  }
  return `<div class="sec-title">Week Plan</div><div class="week-wrap">${rows}</div>`;
}

/* ============ Day sheet (from week) ============ */
function openDaySheet(date){
  let lang="cn";
  const renderSheet=()=>{
    const m=meals[date]||{b:[],d:[]};
    const mealSec=(label,b)=>{
      const arr=m[b]||[];
      let list=arr.map(cn=>{
        const d=findDish(cn); if(!d)return"";
        const name=lang==="en"?esc(d.en):esc(d.cn);
        return `<div class="meal-item"><div style="flex:1;font-size:14px">${name}</div>
          <button class="del" onclick="rmMealDay('${date}','${b}','${esc(cn)}')">✕</button></div>`;
      }).join("") || '<div class="empty" style="padding:10px 0">No dishes</div>';
      return `<div class="meal" style="margin-bottom:10px"><h3>${label}
        <button class="addbtn" onclick="openPicker('${date}','${b}',renderSheet)">+ Add</button></h3>${list}</div>`;
    };
    const html=`<div class="sheet-head"><b>${fullDate(date)}</b>
      <button class="lang-toggle" onclick="lang=lang==='cn'?'en':'cn';renderSheet();">${lang==='cn'?'中 / EN':'EN / 中'}</button>
      <button class="close" onclick="closeOverlay()">✕</button></div>
      <div class="sheet-body">${mealSec("Breakfast","b")}${mealSec("Dinner","d")}</div>
      <div class="actions"><button class="btn-ghost" onclick="closeOverlay()">Done</button></div>`;
    showSheet(html);
  };
  renderSheet();
}
window.rmMealDay=(date,b,cn)=>{ rmMeal(date,b,cn); openDaySheet(date); };

/* ============ Recipes ============ */
function viewRecipes(){
  const dishes=ALL().filter(d=>{
    if(rState.cat!=="all"&&d.cat!==rState.cat)return false;
    if(rState.type!=="all"&&d.type!==rState.type)return false;
    if(rState.spicy!=="all"&&d.spicy!==rState.spicy)return false;
    if(rState.ben!=="all"){ if(!d.ben||!d.ben.includes(rState.ben))return false; }
    if(rState.q){ const q=rState.q.toLowerCase(); const hay=[d.cn,d.en,d.ben||"",...(d.ing||[])].join(" ").toLowerCase(); if(!hay.includes(q))return false; }
    return true;
  });
  const benList=[...new Set(ALL().filter(d=>d.ben).map(d=>d.ben.split("·")[0].trim()))];
  const typeMap={"炒菜":"Stir-fry","炖菜":"Braise","蒸菜":"Steam","汤":"Soup","主食":"Staple","甜品":"Dessert","凉菜":"Cold dish","其他":"Other"};
  const benMap={"孩子长高":"Kids growth","健脾益气":"Spleen","健脾益肾":"Kidneys","补充维生素":"Vitamins","补钙补胶原":"Calcium","助消化补蛋白":"Digestion","健脾补肾":"Kidneys","养胃助消化":"Stomach","增强免疫":"Immunity","开胃助消化":"Appetite","解腻":"Grease","清热祛湿":"Dampness"};

  return `<input class="search" id="rq" placeholder="Search dish / ingredient..." value="${esc(rState.q)}">
  <div class="chips">${["All"].concat(CAT_KEYS.map(k=>CATS[k].emoji+" "+CATS[k].name)).map((txt,i)=>{
    const k=i===0?"all":CAT_KEYS[i-1];
    return `<button class="chip ${rState.cat===k?"active":""}" onclick="setF('cat','${k}')">${txt}</button>`;
  }).join("")}</div>
  <div class="chips">${["All benefits"].concat(benList.map(b=>benMap[b]||b)).map((txt,i)=>{
    const k=i===0?"all":benList[i-1];
    return `<button class="chip ben-chip ${rState.ben===k?"active":""}" onclick="setF('ben','${k}')">${txt}</button>`;
  }).join("")}</div>
  <div class="chips">${TYPES.map((t,i)=>`<button class="chip ${rState.type===t?"active":""}" onclick="setF('type','${t}')">${TYPES_EN[i]}</button>`).join("")}${SPICY.map((s,i)=>`<button class="chip ${rState.spicy===s?"active":""}" onclick="setF('spicy','${s}')">${SPICY_EN[i]}</button>`).join("")}</div>`+
  (dishes.length?dishes.map(d=>{ const c=CATS[d.cat]||CATS.home;
    return `<div class="dish-row" onclick="openDetail('${esc(d.cn)}')">${thumbHtml(d)}
      <div class="info"><div class="cn">${esc(d.cn)}${marks[d.cn]?" "+(marks[d.cn]==="good"?"👍":"👎"):""}</div>
        <div class="en">${esc(d.en)}</div><div class="tags">
        <span class="tag ${d.cat}">${c.name}</span>
        ${d.spicy!=="不辣"?`<span class="tag spicy${SPICY.indexOf(d.spicy)}">${d.spicy}</span>`:""}
        ${d.ben?`<span class="tag ben">${esc(d.ben.split("·")[0])}</span>`:""}
        ${d.herb?`<span class="tag herb">草本</span>`:""}</div></div><div style="color:var(--sub)">›</div></div>`;}).join(""):'<div class="empty">No matching recipes</div>');
}
function setF(k,v){ rState[k]=v; render(); }
function bindRecipes(){
  const q=document.getElementById("rq"); if(!q)return;
  q.addEventListener("input",()=>{ rState.q=q.value; const pos=q.selectionStart; render(); const nq=document.getElementById("rq"); if(nq){nq.focus(); nq.setSelectionRange(pos,pos);} });
}

/* ============ Detail ============ */
function openDetail(cn){
  const d=findDish(cn); if(!d)return;
  const c=CATS[d.cat]||CATS.home;
  const html=`<div class="sheet-head"><b>Recipe</b><button class="close" onclick="closeOverlay()">✕</button></div>
  <div class="sheet-body">
    <div class="d-hero" style="background:${c.bg}">${d.img?`<img src="${esc(d.img)}">`:c.icon}</div>
    <div class="d-cn">${esc(d.cn)}</div><div class="d-en">${esc(d.en)}</div>
    <div class="d-tags"><span class="tag ${d.cat}">${c.name}</span>${d.spicy!=="不辣"?`<span class="tag spicy${SPICY.indexOf(d.spicy)}">${d.spicy}</span>`:""}<span class="tag">${typeEn(d.type)}</span>${d.ben?`<span class="tag ben">${esc(d.ben)}</span>`:""}${d.herb?`<span class="tag herb">福建草本汤</span>`:""}${marks[cn]==="good"?'<span class="tag ben">👍 Keep</span>':""}${marks[cn]==="bad"?'<span class="tag spicy3">👎 Replace</span>':""}</div>
    ${d.mar?`<div class="marinate"><b>⏰ PREP NOTE:</b><br>${esc(d.mar)}</div>`:""}
    <div class="d-sec">🧺 Ingredients</div><ul class="ing-list">${(d.ing||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
    <div class="d-sec">👨‍🍳 Steps</div><ol class="step-list">${(d.st||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    <div class="d-sec" style="font-size:13px;color:var(--sub)">Taste feedback</div>
    <div style="display:flex;gap:8px"><button class="btn-ghost" style="flex:1;border:0;border-radius:10px;padding:8px 0" onclick="mark('${esc(cn)}','good')">👍 Good, keep</button><button class="btn-ghost" style="flex:1;border:0;border-radius:10px;padding:8px 0" onclick="mark('${esc(cn)}','bad')">👎 Replace later</button></div>
  </div>
  <div class="actions"><button class="btn-main" onclick="addMeal('${viewDate}','b','${esc(cn)}');closeOverlay()">+ Breakfast</button><button class="btn-main" onclick="addMeal('${viewDate}','d','${esc(cn)}');closeOverlay()">+ Dinner</button></div>
  <div class="actions" style="border-top:0;padding-top:0"><button class="btn-line" onclick="openEditor(null,'${esc(cn)}')">✏️ Update Recipe</button>${isCustom(cn)?`<button class="btn-del" onclick="delCustom('${esc(cn)}')">🗑 Delete</button>`:""}</div>`;
  showSheet(html);
}
function typeEn(t){ const i=TYPES.indexOf(t); return i>=0?TYPES_EN[i]:t; }
function mark(cn,v){ marks[cn]=(marks[cn]===v?null:v); if(!marks[cn])delete marks[cn]; LSset("frx_marks",marks); openDetail(cn); toast(marks[cn]?"Saved":"Removed"); render(); }
function delCustom(cn){
  if(!confirm("Delete \""+cn+"\"? This cannot be undone."))return;
  customDishes=customDishes.filter(d=>d.cn!==cn);
  Object.keys(meals).forEach(dt=>["b","d"].forEach(mm=>{meals[dt][mm]=(meals[dt][mm]||[]).filter(x=>x!==cn);}));
  LSset("frx_custom",customDishes); LSset("frx_meals",meals); closeOverlay(); render(); toast("Deleted");
}

/* ============ Picker (for any meal) ============ */
let pickCtx={date:today(),b:"b",onDone:null};
function openPicker(date,b,onDone){
  pickCtx={date:date,b:b,onDone:onDone||(()=>{})};
  let pk="all";
  const renderPick=()=>{
    const q=(document.getElementById("pq")?.value||"").toLowerCase();
    const cur=(meals[pickCtx.date]||{})[pickCtx.b]||[];
    const filtered=ALL().filter(d=>{
      if(pk!=="all"&&d.cat!==pk)return false;
      if(q){ const hay=[d.cn,d.en,...(d.ing||[])].join(" ").toLowerCase(); if(!hay.includes(q))return false; }
      return true;
    });
    document.getElementById("plist").innerHTML=filtered.map(d=>{
      const inList=cur.includes(d.cn);
      return `<div class="pick-row ${inList?"added":""}" onclick="togglePick('${esc(d.cn)}')">
        ${inList?"✅":"▫️"} <span>${esc(d.cn)}</span><span class="p-en">${esc(d.en)}</span></div>`;
    }).join("") || '<div class="empty">No matching dishes</div>';
  };
  const html=`<div class="sheet-head"><b>${fullDate(pickCtx.date)} · ${pickCtx.b==="b"?"Breakfast":"Dinner"}</b><button class="close" onclick="closeOverlay();pickCtx.onDone();">✕</button></div>
    <div class="sheet-body" style="padding:10px 16px 0">
      <input class="search" id="pq" placeholder="Search dish / ingredient...">
      <div class="chips" id="pcats">${["All"].concat(CAT_KEYS.map(k=>CATS[k].emoji+" "+CATS[k].name)).map((txt,i)=>{
        const k=i===0?"all":CAT_KEYS[i-1]; return `<button class="chip ${pk===k?"active":""}" data-k="${k}">${txt}</button>`;
      }).join("")}</div>
      <div id="plist"></div>
    </div>
    <div class="actions"><button class="btn-ghost" onclick="closeOverlay();pickCtx.onDone();">Done</button></div>`;
  showSheet(html);
  document.getElementById("pq").addEventListener("input",renderPick);
  document.getElementById("pcats").addEventListener("click",e=>{
    const btn=e.target.closest("button"); if(!btn)return; pk=btn.dataset.k;
    document.querySelectorAll("#pcats .chip").forEach(x=>x.classList.toggle("active",x===btn)); renderPick();
  });
  renderPick();
}
function togglePick(cn){
  const m=meals[pickCtx.date]||{b:[],d:[]}; const cur=m[pickCtx.b]||[];
  if(cur.includes(cn)){ m[pickCtx.b]=cur.filter(x=>x!==cn); toast("Removed"); }
  else { m[pickCtx.b]=cur.concat(cn); toast("Added"); }
  meals[pickCtx.date]=m; LSset("frx_meals",meals);
  // refresh same picker
  const q=document.getElementById("pq"); const ev=new Event("input"); q.dispatchEvent(ev);
}
window.togglePick=togglePick;

/* ============ Text format parser ============ */
function dishToText(d){
  const cn=CATS[d.cat]?.name||"家常菜";
  return `菜名: ${d.cn}\n英文名: ${d.en}\n分类: ${cn}\n类型: ${d.type}\n辣度: ${d.spicy}${d.ben?"\n功效: "+d.ben:""}${d.herb?"\n福建草本: 是":""}${d.img?"\n图片: "+d.img:""}${d.mar?"\n提醒: "+d.mar:""}\n食材:\n${(d.ing||[]).join("\n")}\n步骤:\n${(d.st||[]).map((s,i)=>(i+1)+". "+s).join("\n")}`;
}
function parseDishText(txt){
  const lines=txt.split(/\r?\n/);
  const d={ing:[],st:[]};
  let section=null;
  const catMap={}; CAT_KEYS.forEach(k=>catMap[CATS[k].name]=k);
  for(let ln of lines){
    const t=ln.trim(); if(!t)continue;
    const m=t.match(/^(菜名|中文名|Name|英文名|EN|分类|菜系|类型|做法分类|辣度|功效|图片|腌制提醒|提醒|食材|Ingredients|步骤|Steps|做法)\s*[:：]\s*(.*)$/i);
    if(m){
      const k=m[1].toLowerCase(), v=m[2];
      if(k==="食材"||k==="ingredients"){section="ing";continue;}
      if(k==="步骤"||k==="steps"||k==="做法"){section="st";continue;}
      if(k==="菜名"||k==="中文名"){d.cn=v;section=null;continue;}
      if(k==="英文名"||k==="en"||k==="name"){d.en=v;section=null;continue;}
      if(k==="分类"||k==="菜系"){ d.cat=catMap[v]||"home"; section=null;continue;}
      if(k==="类型"){d.type=v;section=null;continue;}
      if(k==="辣度"){d.spicy=SPICY.includes(v)?v:(v.includes("重")?"重辣":v.includes("中")?"中辣":v.includes("微")?"微辣":"不辣");section=null;continue;}
      if(k==="功效"){d.ben=v;section=null;continue;}
      if(k==="福建草本"){d.herb=/^(是|yes|true|1)/i.test(v);section=null;continue;}
      if(k==="图片"){d.img=v;section=null;continue;}
      if(k==="提醒"){d.mar=v;section=null;continue;}
    }else if(section==="ing"){ d.ing.push(t.replace(/^[-•]\s*/,"")); }
    else if(section==="st"){ d.st.push(t.replace(/^\d+[.、)．]\s*/,"").replace(/^[-•]\s*/,"")); }
  }
  return d;
}
function parseDishBatch(txt){
  /* split by "菜名:" or "中文名:" at line start, return array of parsed dishes */
  const re=/(^[ \t]*(?:菜名|中文名)\s*[:：])/m;
  const parts=txt.split(re);
  const segs=[];
  for(let i=1;i<parts.length;i+=2){ segs.push(parts[i]+parts[i+1]); }
  if(!segs.length) return [parseDishText(txt)];
  return segs.map(s=>parseDishText(s)).filter(d=>d.cn);
}

/* ============ Add / Update editor ============ */
const EXAMPLE_TEXT = `菜名: 可乐鸡翅
英文名: Coca-Cola Chicken Wings
分类: 家常菜
类型: 炒菜
辣度: 不辣
功效: 孩子喜欢 (optional)
图片: https://... or upload below (optional)
提醒: Marinate wings with soy sauce and ginger, 15 minutes. (optional)
食材:
500g chicken wings
1 can cola (330ml)
2 tbsp soy sauce
3 slices ginger
步骤:
1. Pan-fry wings until golden on both sides.
2. Add ginger, cola and soy sauce.
3. Simmer 15 minutes until sauce is thick and glossy.`;
let pendingImg="";
function openEditor(newDish,editCn){
  pendingImg="";
  const d = newDish?null:findDish(editCn);
  const html=`<div class="sheet-head"><b>${newDish?"Add New Dish":"Update Recipe"}</b><button class="close" onclick="closeOverlay()">✕</button></div>
    <div class="sheet-body">
      <p class="hint">Send the dish name to AI, get the recipe text in the format below, paste and save. Upload a photo if you have one.</p>
      <div class="upload-box" id="uBox" onclick="document.getElementById('uFile').click()">
        <div>📷 Tap to upload dish photo</div>
        <img id="uPreview" class="preview" alt="preview">
      </div>
      <input type="file" id="uFile" accept="image/*" onchange="handleImgUpload(this)">
      <textarea id="etext">${esc(newDish?"":dishToText(d))}</textarea>
      <div class="fmt-box">${esc(EXAMPLE_TEXT)}</div>
    </div>
    <div class="actions"><button class="btn-main" onclick="saveEditor(${newDish?'true':'false'},'${esc(editCn||"")}')">Save</button><button class="btn-ghost" onclick="closeOverlay()">Cancel</button></div>`;
  showSheet(html);
  if(d&&d.img){ pendingImg=d.img; const p=document.getElementById("uPreview"); p.src=d.img; p.style.display="block"; }
}
function handleImgUpload(input){
  const file=input.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=e=>{ pendingImg=e.target.result; const p=document.getElementById("uPreview"); p.src=pendingImg; p.style.display="block"; };
  r.readAsDataURL(file);
}
window.handleImgUpload=handleImgUpload;
function saveEditor(isNew,editCn){
  const txt=document.getElementById("etext").value;
  const dishes=parseDishBatch(txt);
  if(!dishes.length||!dishes[0].cn){ toast("Missing dish name"); return; }
  if(isNew&&dishes.length>1){
    let added=0,skipped=0;
    dishes.forEach(d=>{
      if(!(d.ing||[]).length||!(d.st||[]).length){skipped++;return;}
      if(!d.en) d.en=d.cn; if(!d.type) d.type="炒菜"; if(!d.spicy) d.spicy="不辣";
      if(findDish(d.cn)){skipped++;return;}
      customDishes.push(d); added++;
    });
    LSset("frx_custom",customDishes);
    closeOverlay(); render(); toast(added+" added, "+skipped+" skipped");
    return;
  }
  const d=dishes[0];
  if(!(d.ing||[]).length||!(d.st||[]).length){ toast("Missing ingredients or steps"); return; }
  if(!d.en) d.en=d.cn;
  if(!d.type) d.type="炒菜";
  if(!d.spicy) d.spicy="不辣";
  if(pendingImg) d.img=pendingImg;
  if(isNew){
    if(findDish(d.cn)){ toast("Dish already exists"); return; }
    customDishes.push(d); LSset("frx_custom",customDishes);
  }else{
    if(d.cn!==editCn){
      Object.keys(meals).forEach(dt=>["b","d"].forEach(mm=>{meals[dt][mm]=(meals[dt][mm]||[]).map(x=>x===editCn?d.cn:x);}));
      LSset("frx_meals",meals);
    }
    if(isCustom(d.cn)){ customDishes=customDishes.map(x=>x.cn===editCn?d:x); LSset("frx_custom",customDishes); }
    else{ overrides[d.cn]=d; LSset("frx_overrides",overrides); }
  }
  closeOverlay(); render(); toast("Saved");
}

/* ============ Manage ============ */
function viewManage(){
  return `<div class="sec-title">Add New Dish</div>
    <div class="card"><p class="hint">Send the dish name to AI, get the recipe text in the format below, paste and save. Upload a photo if you have one.</p>
      <div class="grid-btns"><button onclick="openEditor(true)">Add Dish</button></div></div>
    <div class="sec-title">Data Backup</div>
    <div class="card"><p class="hint">Everything is stored on this phone's browser. Export a backup before changing phones or clearing browser data.</p>
      <div class="grid-btns"><button onclick="exportData()">Export Backup</button><button onclick="importData()">Import Backup</button></div>
      <input type="file" id="impFile" accept=".json" style="display:none"></div>
    <div class="sec-title">Recipe Text Format</div>
    <div class="card"><div class="fmt-box">${esc(EXAMPLE_TEXT)}</div><p class="hint">Copy this format and ask any AI to fill it in for a new dish.</p></div>`;
}
function exportData(){
  const data={custom:customDishes,overrides:overrides,meals:meals,marks:marks};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="family-recipes-backup-"+today()+".json"; a.click(); toast("Backup exported");
}
function importData(){
  const f=document.getElementById("impFile"); f.onchange=()=>{
    const file=f.files[0]; if(!file)return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const data=JSON.parse(r.result);
      if(data.custom)customDishes=data.custom;
      if(data.overrides)overrides=data.overrides;
      if(data.meals)meals=data.meals;
      if(data.marks)marks=data.marks;
      LSset("frx_custom",customDishes);LSset("frx_overrides",overrides);LSset("frx_meals",meals);LSset("frx_marks",marks);
      render(); toast("Backup imported");
    }catch(e){ toast("Invalid file"); } };
    r.readAsText(file);
  }; f.click();
}

/* ============ Overlay ============ */
function showSheet(html){
  const o=document.getElementById("overlay");
  o.innerHTML=`<div class="sheet">${html}</div>`; o.classList.add("show");
  o.onclick=e=>{ if(e.target===o)closeOverlay(); };
}
function closeOverlay(){ const o=document.getElementById("overlay"); o.classList.remove("show"); o.innerHTML=""; }

render();
</script>
