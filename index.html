<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family Recipes</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#2b2a26; --sub:#8a857c; --line:#eae6dd;
  --main:#d9532b; --main-soft:#fdeee8; --green:#4f7a3d; --green-soft:#eef3ea;
  --amber:#b07800; --amber-soft:#fff6df; --purple:#6d4f9e; --purple-soft:#f1ecfa;
  --blue:#3a6ea5; --blue-soft:#e9f1f9; --red:#c0392b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:70px;}
header{padding:14px 16px 10px;position:sticky;top:0;background:rgba(246,244,239,.95);backdrop-filter:blur(8px);z-index:20;}
header.hidden{display:none;}
header h1{font-size:18px;font-weight:700;}
header .sub{font-size:12px;color:var(--sub);margin-top:2px;}
main{padding:8px 12px 20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.sec-title{font-size:15px;font-weight:700;margin:6px 2px 8px;display:flex;align-items:center;gap:6px;}
.sec-title small{font-weight:400;color:var(--sub);font-size:12px;}

/* tabs */
#tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
#tabbar button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;}
#tabbar button .ico{font-size:20px;line-height:1;}
#tabbar button.active{color:var(--main);font-weight:600;}

/* tags */
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#f0ede6;color:#666;}
.tag.home{background:#fdeee8;color:#c1442a;}
.tag.fujian{background:#e9f1f9;color:#3a6ea5;}
.tag.hot{background:#fde3dd;color:#c0392b;}
.tag.soup{background:#eef3ea;color:#4f7a3d;}
.tag.spicy0{background:#eef2ea;color:#5f7a3d;}
.tag.spicy1{background:#fff3d6;color:#b07800;}
.tag.spicy2{background:#ffe0cc;color:#c2571a;}
.tag.spicy3{background:#fdd7d0;color:#b03a2e;}
.tag.ben{background:#f1ecfa;color:#6d4f9e;}
.tag.herb{background:#e2f3ee;color:#1d7a68;}

/* dish list */
.dish-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.dish-row .thumb{width:46px;height:46px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;}
.dish-row .info{flex:1;min-width:0;}
.dish-row .cn{font-weight:600;font-size:15px;}
.dish-row .en{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dish-row .tags{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;}
.dish-row .tags .tag{font-size:10px;padding:1px 6px;}

/* chips row */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink);}
.chip.active{background:var(--main);border-color:var(--main);color:#fff;}
.chip.ben-chip.active{background:var(--purple);border-color:var(--purple);}

/* search */
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;background:#fff;margin-bottom:8px;}
.search:focus{outline:none;border-color:var(--main);}

/* day nav */
.day-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;}
.day-nav button{width:34px;height:34px;border:0;background:var(--bg);border-radius:99px;font-size:18px;color:var(--main);display:flex;align-items:center;justify-content:center;}
.day-nav .date{font-size:16px;font-weight:700;text-align:center;}

/* meal cards */
.meal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.meal h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.meal h3 .addbtn{font-size:12px;background:var(--main);color:#fff;border:0;border-radius:99px;padding:5px 12px;}
.meal-empty{color:var(--sub);font-size:13px;padding:10px 0;text-align:center;}
.meal-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.meal-item:last-child{border-bottom:0;}
.meal-item .thumb{width:40px;height:40px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;}
.meal-item .mi-info{flex:1;min-width:0;}
.meal-item .mi-cn{font-weight:600;font-size:14px;}
.meal-item .mi-en{font-size:11px;color:var(--sub);}
.meal-item .del{border:0;background:none;color:var(--sub);font-size:18px;padding:6px;}

/* week grid */
.week-row{display:flex;border-bottom:1px solid var(--line);}
.week-row:last-child{border-bottom:0;}
.week-day{flex:0 0 64px;padding:10px 6px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.week-day .wd-name{font-size:13px;font-weight:600;}
.week-day .wd-date{font-size:11px;color:var(--sub);}
.week-day.today .wd-name{color:var(--main);}
.week-meals{flex:1;padding:8px 10px;min-height:56px;}
.week-meals .wm{font-size:12px;margin:3px 0;display:flex;gap:6px;align-items:baseline;}
.week-meals .wm b{color:var(--sub);font-weight:400;font-size:11px;flex:none;width:22px;}
.week-meals .wm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.week-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}

/* overlay (detail / picker / editor) */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;}
#overlay.show{display:block;}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet .sheet-head{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:5;border-radius:18px 18px 0 0;gap:10px;}
.sheet .sheet-head b{font-size:16px;flex:1;}
.sheet .close{border:0;background:#f0ede6;border-radius:99px;width:28px;height:28px;font-size:15px;color:var(--sub);}
.sheet .sheet-body{padding:16px;}
.sheet .actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;}
.sheet .actions button{flex:1;border:0;border-radius:10px;padding:11px 0;font-size:14px;font-weight:600;}
.btn-main{background:var(--main);color:#fff;}
.btn-ghost{background:#f0ede6;color:var(--ink);}
.btn-line{background:#fff;border:1px solid var(--line)!important;color:var(--ink);}
.btn-del{background:#fff;border:1px solid #fdd7d0!important;color:var(--red);}
.lang-toggle{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px;color:var(--ink);}

/* detail */
.d-hero{height:150px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:12px;background:var(--main-soft);overflow:hidden;}
.d-hero img{width:100%;height:100%;object-fit:cover;border-radius:14px;}
.d-cn{font-size:20px;font-weight:700;}
.d-en{font-size:13px;color:var(--sub);margin:2px 0 8px;}
.d-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.marinate{background:var(--amber-soft);border:1px solid #f3dfae;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.55;}
.marinate b{color:var(--amber);}
.d-sec{font-size:14px;font-weight:700;margin:14px 0 6px;}
.ing-list li{list-style:none;font-size:13.5px;line-height:1.7;padding-left:16px;position:relative;color:#3c3a35;}
.ing-list li::before{content:"•";position:absolute;left:2px;color:var(--main);}
.step-list{counter-reset:s;}
.step-list li{list-style:none;position:relative;padding:8px 0 8px 34px;font-size:13.5px;line-height:1.6;border-bottom:1px dashed var(--line);color:#3c3a35;}
.step-list li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:22px;height:22px;background:var(--main-soft);color:var(--main);border-radius:99px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.step-list li:last-child{border-bottom:0;}

/* picker */
.pick-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;}
.pick-row:last-child{border-bottom:0;}
.pick-row .p-en{font-size:11px;color:var(--sub);display:block;}
.pick-row.added{color:var(--main);font-weight:600;}

/* manage */
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;min-height:200px;background:#fff;resize:vertical;}
textarea:focus{outline:none;border-color:var(--main);}
.fmt-box{background:#faf8f3;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:12px;line-height:1.6;white-space:pre-wrap;color:#5a564e;margin:8px 0;font-family:inherit;}
.hint{font-size:12px;color:var(--sub);line-height:1.6;}
.empty{text-align:center;color:var(--sub);padding:30px 0;font-size:13px;}
.grid-btns{display:flex;gap:8px;margin-top:8px;}
.grid-btns button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-size:13px;color:var(--ink);}
.upload-box{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;background:#faf8f3;color:var(--sub);font-size:13px;margin:8px 0;}
.upload-box input{display:none;}
.upload-box .preview{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:6px;display:none;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(40,38,34,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;z-index:99;display:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="hTitle">Recipes</h1>
    <p class="sub" id="hSub"></p>
  </header>
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="today"><span class="ico">🍚</span>Today</button>
    <button data-tab="week"><span class="ico">📅</span>Week</button>
    <button data-tab="recipes" class="active"><span class="ico">📖</span>Recipes</button>
    <button data-tab="manage"><span class="ico">➕</span>Manage</button>
  </nav>
</div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ Categories ============ */
const CATS = {
  home:{name:"家常菜", emoji:"🏠", bg:"#fdeee8", fg:"#c1442a", icon:"🥘"},
  fujian:{name:"福建菜", emoji:"🌊", bg:"#e9f1f9", fg:"#3a6ea5", icon:"🍜"},
  hot:{name:"网红菜", emoji:"🔥", bg:"#fde3dd", fg:"#c0392b", icon:"🌶️"},
  soup:{name:"养生汤", emoji:"🥣", bg:"#eef3ea", fg:"#4f7a3d", icon:"🍲"},
};
const CAT_KEYS = Object.keys(CATS);
const SPICY = ["不辣","微辣","中辣","重辣"
];
const SPICY_EN = ["Not spicy","Mild","Medium","Hot"];
const TYPES = ["炒菜","炖菜","蒸菜","汤","主食","甜品","凉菜","其他"];
const TYPES_EN = ["Stir-fry","Braise","Steam","Soup","Staple","Dessert","Cold dish","Other"];
const WD_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WD_CN = ["周日","周一","周二","周三","周四","周五","周六"];

/* ============ 49 built-in dishes ============ */
const BASE_DISHES = [
{cn:"番茄炒蛋",en:"Stir-fried Tomato and Egg",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["3 eggs","2 medium tomatoes, cut into wedges","2 tbsp cooking oil","1 tsp sugar","1/2 tsp salt","1 scallion, chopped"],
 st:["Beat the eggs with a pinch of salt until well mixed.","Heat 1 tbsp oil in a wok over high heat, pour in eggs, scramble until just set, then remove.","Add the remaining oil, stir-fry tomato wedges for 1 minute, add sugar and a pinch of salt.","Return eggs to the wok, toss gently so tomatoes and eggs mix, 30 seconds.","Sprinkle scallions and serve."],img:"img/番茄炒蛋.jpg"},
{cn:"青椒土豆丝",en:"Shredded Potato with Green Pepper",cat:"home",type:"炒菜",spicy:"微辣",
 ing:["2 medium potatoes, julienned","1 green pepper, julienned","2 dried chilies (optional)","2 cloves garlic, sliced","2 tbsp vinegar","1 tsp salt","3 tbsp cooking oil"],
 st:["Soak the shredded potato in cold water for 5 minutes, drain well (this keeps it crisp).","Heat oil in a wok, add dried chilies and garlic, stir until fragrant.","Add potato shreds, stir-fry over high heat for 2 minutes.","Add green pepper, vinegar and salt, stir-fry another 1-2 minutes until just tender but still crisp.","Serve immediately."],img:"img/青椒土豆丝.jpg"},
{cn:"清炒时蔬",en:"Stir-fried Seasonal Greens",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["400g leafy greens (bok choy / Chinese broccoli / spinach)","3 cloves garlic, sliced","1 tbsp cooking oil","1/2 tsp salt"],
 st:["Wash greens thoroughly, drain. Cut into sections if large.","Heat oil over high heat, add garlic and stir until fragrant.","Add greens, stir-fry vigorously for 1-2 minutes until bright and just wilted.","Season with salt, toss once, serve."],img:"img/清炒时蔬.jpg"},
{cn:"油焖笋",en:"Braised Spring Bamboo Shoots",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["500g fresh bamboo shoots, peeled and cut into strips","2 tbsp light soy sauce","1 tbsp sugar","1/2 cup chicken stock or water","2 tbsp cooking oil","2 scallions, knotted"],
 st:["Blanch bamboo shoots in boiling water for 3 minutes, drain (removes bitterness).","Heat oil, add scallion knots and stir until fragrant.","Add bamboo shoots, stir-fry 1 minute.","Add soy sauce, sugar and stock, cover and simmer over medium heat for 8-10 minutes until liquid is mostly reduced.","Uncover, raise heat to glaze the shoots, serve."],img:"img/油焖笋.jpg"},
{cn:"青椒肉丝",en:"Shredded Pork with Green Pepper",cat:"home",type:"炒菜",spicy:"微辣",mar:"Marinate pork: 1 tsp light soy sauce + 1/2 tsp cornstarch + 1 tsp water, mix and rest 10 minutes.",
 ing:["250g pork loin, cut into thin shreds","2 green peppers, shredded","2 cloves garlic, sliced","1 tbsp light soy sauce","1/2 tsp dark soy sauce (for color)","1 tsp cornstarch + 1 tbsp water (to thicken)","3 tbsp cooking oil"],
 st:["Marinate the pork shreds (see note above).","Heat 2 tbsp oil over high heat, add pork, quickly stir-fry until it turns white, remove.","Add remaining oil, stir-fry garlic and green peppers for 1 minute.","Return pork, add soy sauces, toss together.","Pour in cornstarch water, stir until glossy, serve."],img:"img/青椒肉丝.jpg"},
{cn:"木须肉",en:"Moo Shu Pork",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["150g pork loin, sliced thin","3 eggs, beaten","5g dried wood ear mushrooms, soaked and shredded","1/2 cucumber, sliced","2 cloves garlic, minced","1 tbsp cooking wine","1 tbsp light soy sauce","1/2 tsp salt","3 tbsp oil"],
 mar:"Marinate pork: 1 tsp cooking wine + 1/2 tsp cornstarch, rest 10 minutes.",
 st:["Heat 1 tbsp oil, scramble eggs until just set, remove.","Heat 2 tbsp oil, stir-fry pork until color changes.","Add garlic, wood ear and cucumber, stir-fry 1 minute.","Return eggs, add wine, soy sauce and salt, toss everything together.","Break eggs into pieces with the spatula, serve."],img:"img/木须肉.jpg"},
{cn:"清炒虾仁",en:"Stir-fried Shrimp",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["300g shrimp, peeled and deveined","1 tsp cornstarch","1 egg white (half)","1/2 tsp salt","2 slices ginger","1 tbsp cooking wine","2 tbsp cooking oil","1 scallion, chopped"],
 mar:"Marinate shrimp: salt + egg white + cornstarch, mix gently and rest 15 minutes. This makes shrimp bouncy and tender.",
 st:["Marinate shrimp (see note above).","Heat oil over medium-high heat, add ginger, then shrimp.","Stir-fry 1-2 minutes until shrimp curl and turn pink.","Splash cooking wine around the edge of the wok.","Remove to plate, sprinkle scallion, serve."],img:"img/清炒虾仁.jpg"},
{cn:"干煸四季豆",en:"Dry-fried Green Beans",cat:"home",type:"炒菜",spicy:"微辣",
 ing:["400g green beans, trimmed","80g ground pork","3 dried chilies","1 clove garlic, minced","1 tsp light soy sauce","1/2 tsp sugar","1/2 tsp salt","4 tbsp cooking oil"],
 st:["Heat 3 tbsp oil over medium heat, fry green beans 4-5 minutes until wrinkled and slightly blistered, remove.","Leave 1 tbsp oil, stir-fry ground pork until crispy and browned.","Add dried chilies and garlic, stir until fragrant.","Return beans, add soy sauce, sugar and salt, toss 1 minute.","Serve."],img:"img/干煸四季豆.jpg"},
{cn:"红烧肉",en:"Braised Pork Belly (Hong Shao Rou)",cat:"home",type:"炖菜",spicy:"不辣",
 ing:["600g pork belly, cut into 3cm cubes","30g rock sugar (or 2 tbsp sugar)","2 tbsp Shaoxing cooking wine","2 tbsp light soy sauce","1 tbsp dark soy sauce","4 slices ginger","2 scallions, knotted","1 star anise","3 cups hot water"],
 st:["Blanch pork belly in boiling water 3 minutes, rinse off foam, drain.","Melt sugar with 1 tbsp oil over low heat until amber colored.","Add pork, toss to coat in caramel until lightly browned.","Add ginger, scallion, star anise, wine, both soy sauces and hot water. Bring to boil.","Simmer covered on low heat for 50 minutes, until pork is fork-tender.","Uncover, raise heat to reduce sauce until thick and glossy, about 5-10 minutes. Serve."],img:"img/红烧肉.jpg"},
{cn:"土豆炖牛肉",en:"Beef and Potato Stew",cat:"home",type:"炖菜",spicy:"不辣",
 ing:["500g beef shank or stew beef, cut into 3cm cubes","2 potatoes, cut into chunks","1 carrot, cut into chunks","3 slices ginger","2 tbsp light soy sauce","1 tbsp dark soy sauce","1 tbsp cooking wine","1 bay leaf","4 cups hot water","1 tsp salt"],
 st:["Blanch beef in boiling water 3 minutes, rinse, drain.","Stir-fry beef with ginger and wine for 2 minutes.","Add soy sauces, bay leaf and hot water, bring to boil.","Simmer covered on low heat for 60 minutes.","Add potato and carrot chunks, simmer another 20 minutes until tender.","Season with salt, reduce sauce slightly, serve."],img:"img/土豆炖牛肉.jpg"},
{cn:"番茄牛腩",en:"Tomato Beef Brisket",cat:"home",type:"炖菜",spicy:"不辣",
 ing:["500g beef brisket, cut into cubes","3 ripe tomatoes, cut into chunks","1/2 onion, sliced","2 slices ginger","1 tbsp tomato paste","1 tbsp cooking wine","1 tbsp light soy sauce","1 tsp sugar","4 cups hot water","1 tsp salt"],
 st:["Blanch brisket in boiling water 3 minutes, rinse, drain.","Stir-fry onion and ginger until fragrant, add brisket and wine, stir 2 minutes.","Add tomato paste, soy sauce and hot water, simmer covered 70 minutes.","Add tomato chunks and sugar, simmer 15 more minutes.","Season with salt, simmer 5 minutes until sauce thickens. Serve."],img:"img/番茄牛腩.jpg"},
{cn:"萝卜炖牛腩",en:"Daikon and Beef Brisket Stew",cat:"home",type:"炖菜",spicy:"不辣",
 ing:["500g beef brisket, cubed","600g daikon radish, peeled and cut into chunks","4 slices ginger","2 scallions","1 tbsp cooking wine","2 tbsp light soy sauce","1 tsp salt","4 cups hot water","1/2 tsp white pepper"],
 st:["Blanch brisket 3 minutes, rinse, drain.","Put brisket, ginger, scallions, wine, soy sauce and water in a pot, bring to boil.","Simmer covered on low heat for 70 minutes.","Add daikon chunks, simmer 20 minutes until daikon is translucent and tender.","Season with salt and white pepper, serve hot."],img:"img/萝卜炖牛腩.jpg"},
{cn:"清蒸鲈鱼",en:"Steamed Sea Bass",cat:"home",type:"蒸菜",spicy:"不辣",
 ing:["1 whole sea bass (about 600g), cleaned","5 slices ginger","3 scallions (2 whole, 1 shredded)","3 tbsp seasoned steamed-fish soy sauce","2 tbsp hot oil"],
 st:["Score both sides of the fish with 2 cuts. Stuff cavity with some ginger and scallion.","Place fish on a plate, top with remaining ginger and scallion.","Steam over high heat for 8 minutes (10 if fish is over 700g). Turn off heat, rest 2 minutes.","Discard the steaming liquid and old ginger/scallion, place fresh shredded ginger and scallion on fish.","Heat 2 tbsp oil until smoking, pour over the ginger and scallion, then pour soy sauce around the fish. Serve."],img:"img/清蒸鲈鱼.jpg"},
{cn:"番茄蛋花汤",en:"Tomato Egg Drop Soup",cat:"home",type:"汤",spicy:"不辣",
 ing:["1 tomato, cut into wedges","2 eggs, beaten","3 cups chicken stock or water","1 tsp sesame oil","1/2 tsp salt","1 scallion, chopped","1 tsp cornstarch + 2 tbsp water (optional)"],
 st:["Bring stock to a boil, add tomato wedges, simmer 3 minutes.","Season with salt. If you like it thicker, stir in cornstarch water.","Turn heat to low, slowly pour beaten eggs in a thin stream while stirring gently in one direction.","Drizzle sesame oil, sprinkle scallion, serve."],img:"img/番茄蛋花汤.jpg"},
{cn:"紫菜蛋花汤",en:"Seaweed Egg Drop Soup",cat:"home",type:"汤",spicy:"不辣",
 ing:["1 sheet dried seaweed (nori), torn into pieces","2 eggs, beaten","3 cups water or chicken stock","1/2 tsp salt","1 tsp sesame oil","1 scallion, chopped"],
 st:["Bring water to a boil, add seaweed, simmer 1 minute.","Season with salt.","Turn to low heat, slowly drizzle beaten eggs while stirring gently.","Drizzle sesame oil, sprinkle scallion, serve."],img:"img/紫菜蛋花汤.jpg"},
{cn:"冬瓜排骨汤",en:"Winter Melon and Pork Rib Soup",cat:"home",type:"汤",spicy:"不辣",
 ing:["500g pork ribs, cut into sections","500g winter melon, peeled and cut into chunks","3 slices ginger","8 cups water","1 tsp salt","2 scallions, chopped"],
 st:["Blanch ribs in boiling water 3 minutes, rinse off foam.","Put ribs, ginger and water in a pot, bring to boil, skim foam.","Simmer covered on low heat for 45 minutes.","Add winter melon, simmer 15 minutes until translucent.","Season with salt, sprinkle scallions, serve."],img:"img/冬瓜排骨汤.jpg"},

 ing:["500g pork ribs","1 Chinese yam (tie gun shan yao), peeled and cut into chunks (wear gloves — it can itch)","1 carrot, cut into chunks","1 corn on the cob, cut into sections","Scallion & ginger, a few pieces","1 tbsp cooking wine","1 tsp salt"],
 st:["Peel and cut carrot, corn and yam into chunks.","Blanch ribs in cold water with scallion, ginger and cooking wine. Rinse clean.","Sauté scallion, ginger and ribs with a little oil in a pot.","Add plenty of hot water and all vegetables, simmer about 40 minutes.","Season with salt before serving."]},
{cn:"油爆虾",en:"Deep-fried River Shrimp",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["300g small river shrimp, trimmed whiskers, rinsed and very dry","1.5 tbsp light soy sauce","1 tbsp sugar","1 tbsp Shaoxing wine","2 slices ginger","3 tbsp cooking oil","1 scallion, chopped"],
 st:["Mix soy sauce, sugar and wine in a small bowl.","Heat oil over high heat until hot, deep-fry shrimp 1-2 minutes until shells turn red and crisp, remove.","Leave a little oil, stir ginger, pour in sauce mixture, bring to a bubble.","Return shrimp, toss quickly to coat, about 30 seconds.","Sprinkle scallion, serve. Shells can be eaten."],img:"img/油爆虾.jpg"},
{cn:"响油鳝糊",en:"Sizzling Eel Paste",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["400g eel shreds (ask fishmonger to shred, or buy frozen shreds)","1 tbsp cooking wine","1 tbsp light soy sauce","1/2 tbsp dark soy sauce","1 tsp sugar","1 tsp cornstarch + 2 tbsp water","3 slices ginger, shredded","2 cloves garlic, minced","2 scallions, part cut into shreds","2 tbsp sesame oil (final pour)"],
 st:["Blanch eel shreds in boiling water 30 seconds, drain.","Stir-fry ginger, garlic and white part of scallion until fragrant.","Add eel shreds, wine, soy sauces, sugar and 1/2 cup water, simmer 2 minutes.","Thicken with cornstarch water, pour onto a plate, mound the shredded scallion and ginger on top.","Heat sesame oil until smoking, pour it over the shredded scallion on top (it should sizzle loudly). Serve."],img:"img/响油鳝糊.jpg"},
{cn:"清炒河虾仁",en:"Stir-fried River Shrimp",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["300g river shrimp, shelled","1 egg white (use half)","1 tsp cornstarch","1/2 tsp salt","1 slice ginger","1 tbsp cooking wine","2 tbsp oil"],
 mar:"Marinate shrimp: salt + egg white + cornstarch, rest 15 minutes for a silky texture.",
 st:["Marinate shrimp (see note).","Heat oil, add ginger, stir-fry shrimp on medium-high heat 1-2 minutes until pink.","Splash wine around the edge.","Remove immediately while tender and springy. Serve."],img:"img/清炒河虾仁.jpg"},
{cn:"腌笃鲜",en:"Salted and Fresh Pork Bamboo Soup",cat:"home",type:"汤",spicy:"不辣",
 ing:["200g salted pork, cut into chunks","300g fresh pork belly, cut into chunks","300g fresh bamboo shoots, rolled-cut","10 tofu knots (optional)","4 slices ginger","2 tbsp cooking wine","8 cups water"],
 st:["Blanch both porks in boiling water 3 minutes, rinse.","Put pork, ginger, wine and water in a clay pot, bring to boil, skim foam.","Simmer covered on low heat for 60 minutes.","Add bamboo shoots and tofu knots, simmer 30 more minutes.","Taste before adding salt (salted pork is already salty). Serve hot."],img:"img/腌笃鲜.jpg"},
{cn:"滑蛋虾仁",en:"Shrimp with Scrambled Eggs",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["250g shrimp, peeled","3 eggs","2 tbsp milk","1/2 tsp salt","1/2 tsp cornstarch + 1 tbsp water","2 tbsp oil","1 scallion, chopped"],
 mar:"Marinate shrimp: pinch of salt + 1/2 tsp cornstarch + few drops of cooking oil, rest 10 minutes.",
 st:["Marinate shrimp (see note). Beat eggs with milk and salt, do NOT over-beat.","Stir-fry shrimp in 1 tbsp oil until just pink, about 1 minute. Remove and fold into the eggs.","Heat remaining oil over medium-low heat, pour in egg-shrimp mixture.","Push eggs gently from the edge to the center as they set; stop when still slightly runny and glossy.","Sprinkle scallion, slide onto a plate. The eggs finish cooking on the plate. Serve."],img:"img/滑蛋虾仁.jpg"},
{cn:"蚝油牛肉",en:"Oyster Sauce Beef",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["300g beef (flank or sirloin), sliced against the grain","1 green pepper or 150g broccoli","1.5 tbsp oyster sauce","1 tsp light soy sauce","1/2 tsp sugar","1 tsp cornstarch + 2 tbsp water","2 slices ginger","3 tbsp oil"],
 mar:"Tenderize & marinate beef (KEY STEP): 1/4 tsp baking soda + 1 tbsp water, mix into beef, rest 15 minutes, rinse briefly and squeeze dry; then add 1 tsp soy sauce + 1 tsp cornstarch + 1 tsp oil, rest 10 minutes.",
 st:["Marinate beef as described in the note above.","Blanch broccoli 1 minute (or stir-fry green pepper), set aside.","Heat oil until very hot, stir-fry beef 1 minute until color changes, remove.","Stir-fry ginger, add oyster sauce, soy sauce, sugar and 2 tbsp water, bring to a bubble.","Return beef and vegetable, toss 30 seconds, thicken with cornstarch water, serve."],img:"img/蚝油牛肉.jpg"},
{cn:"白灼虾",en:"Poached Shrimp",cat:"home",type:"蒸菜",spicy:"不辣",
 ing:["500g live shrimp","4 slices ginger","3 scallions","1 tbsp cooking wine","Dipping: 2 tbsp steamed-fish soy sauce + ginger shreds"],
 st:["Bring a pot of water to rolling boil with ginger, scallions and wine.","Add shrimp, cook 2-3 minutes until they curl and turn bright orange. Do not overcook.","Remove immediately and plunge into ice water for 1 minute (makes the meat pop).","Drain, arrange on plate, serve with soy sauce and ginger shreds for dipping."],img:"img/白灼虾.jpg"},

 ing:["1 head cauliflower (loose florets, about 600g)","1 tsp salt (for washing)","Water, enough to submerge the cauliflower","1 small spoon pork lard (or cooking oil)","2 fresh chili peppers, sliced into rings","4-5 slices ginger","2-3 scallions, cut into sections","15 Sichuan peppercorns","5 cloves garlic, peeled","1 tsp cumin powder","1 tsp pepper powder","2 tsp light soy sauce"],
 st:["Pick a loose cauliflower; peel off the tough fibers from the stem and cut into small florets. Soak and rinse in salted water (1 tsp salt in water enough to submerge). Drain well.","Slice 2 chilies into rings; prepare 4-5 ginger slices, 2-3 scallions into sections, 15 Sichuan peppercorns and 5 peeled garlic cloves.","Heat a small amount of pork lard in a pan. Stir-fry the cauliflower dry, then cover and cook over medium-low heat for a few seconds. Continue stir-frying until the surface becomes slightly charred. Transfer to a bowl and set aside.","Add a little more oil to the pan. Stir-fry ginger, garlic, chilies and Sichuan peppercorns until fragrant.","Return the cauliflower to the pan and continue stir-frying.","Add cumin powder, pepper powder and soy sauce. Toss evenly.","Add scallion sections just before serving, give a few quick stirs, and serve."]},
{cn:"红糟肉",en:"Red Yeast Rice Pork",cat:"fujian",type:"炒菜",spicy:"不辣",
 ing:["500g pork belly, sliced","3 tbsp red yeast rice lees (hong zao)","1 tbsp cooking wine","1 tbsp sugar","1 tbsp light soy sauce","2 slices ginger","2 tbsp oil","1/2 cup water"],
 st:["Heat oil, stir-fry ginger and pork slices until edges are slightly golden.","Add red yeast rice lees, stir-fry until the oil turns red and fragrant.","Add wine, soy sauce, sugar and water, mix well.","Simmer covered on medium-low heat 20 minutes.","Uncover, reduce sauce until it coats the pork in a red glaze. Serve. Note: if red lees is unavailable, ask the family to buy it at a Chinese/Fujian grocery."],img:"img/红糟肉.jpg"},
{cn:"鼎边糊",en:"Rice Paste Soup (Ding Bian Hu)",cat:"fujian",type:"汤",spicy:"不辣",
 ing:["150g rice milk (blend 100g soaked rice with 250ml water into a smooth batter)","6 dried shrimp, soaked","20g dried mushroom, soaked and sliced","50g small clams or shredded pork","4 cups chicken stock","1 tbsp soy sauce","1 tsp sesame oil","scallion + celery, chopped"],
 st:["Bring stock to a boil with dried shrimp, mushroom and clams; season with soy sauce.","Keep the soup at a rolling boil, swirl the rice milk along the side of the pot into a thin layer.","Let it set for 10 seconds, then scrape the set rice sheets into the soup with a spatula.","Repeat until all batter is used.","Drizzle sesame oil, sprinkle scallion and celery, serve hot."],img:"img/鼎边糊.jpg"},
{cn:"荔枝肉",en:"Lychee Pork (Sweet & Sour Pork, Fujian Style)",cat:"fujian",type:"炒菜",spicy:"不辣",
 ing:["400g pork loin, cut into thick strips and cross-hatched","1 potato, cut into chunks","3 tbsp sweet potato starch","Sauce: 3 tbsp vinegar + 3 tbsp sugar + 2 tbsp ketchup + 1 tbsp soy sauce + 3 tbsp water","Frying oil"],
 st:["Coat pork strips with sweet potato starch.","Deep-fry potato chunks until golden, remove.","Deep-fry pork strips over medium-high heat 3 minutes until golden and the cross-hatch opens up like lychee flesh; re-fry 30 seconds at high heat for crispiness.","Pour out oil, add sauce mixture, bring to a boil until slightly thick.","Return pork and potato, toss to coat, serve."],img:"img/荔枝肉.jpg"},
{cn:"鱼丸汤",en:"Fish Ball Soup",cat:"fujian",type:"汤",spicy:"不辣",
 ing:["300g Fuzhou-style fish balls (bouncy white ones with meat filling, frozen section of Asian grocery)","4 cups chicken stock or water","1 tsp salt","1 scallion, chopped","1 tbsp celery, chopped","few drops sesame oil","1 tbsp toasted laver (seaweed), optional"],
 st:["Bring stock to a gentle boil.","Add frozen fish balls, simmer 5-6 minutes until they float and swell up.","Season with salt.","Ladle into bowls, sprinkle scallion, celery and seaweed, drizzle sesame oil, serve."],img:"img/鱼丸汤.jpg"},
{cn:"光饼",en:"Guang Bing Bread (Fujian Sesame Flatbread)",cat:"fujian",type:"主食",spicy:"不辣",
 ing:["300g all-purpose flour","3g instant yeast","1 tsp sugar","1/2 tsp salt","180ml warm water","1 tbsp sesame oil for the dough","white sesame seeds for topping","Salted pork or scrambled egg, to stuff (optional)"],
 st:["Mix flour, yeast, sugar, salt, sesame oil and warm water into a smooth dough. Cover, rest 40 minutes until doubled.","Divide into 8 balls, flatten each into a 1cm-thick disc, press sesame seeds on top.","Bake at 220°C for 15 minutes until golden and puffed (or pan-fry on low heat 5 minutes per side with a lid).","Serve plain, or slice open and stuff with stir-fried salted pork or egg."],img:"img/光饼.jpg"},
{cn:"沙茶面",en:"Shacha Noodles (Satay Noodle Soup)",cat:"fujian",type:"主食",spicy:"微辣",
 ing:["2 portions fresh noodles","2 tbsp Shacha sauce (satay paste, Xiamen style)","200g shrimp, peeled","100g bean sprouts","1 block firm tofu, cubed and pan-fried","3 cups chicken stock","1 tsp sugar","1 tbsp oil"],
 st:["Heat oil, stir-fry Shacha sauce until fragrant, about 30 seconds.","Add chicken stock and sugar, bring to a boil.","Add tofu and shrimp, simmer 3 minutes. Keep this broth simmering.","In another pot, boil noodles 2-3 minutes, blanch bean sprouts 30 seconds.","Assemble: noodles in a bowl, top with sprouts and tofu, ladle the hot shrimp Shacha broth over. Serve."],img:"img/沙茶面.jpg"},
{cn:"海蛎煎",en:"Oyster Omelet (Hai Li Jian)",cat:"fujian",type:"炒菜",spicy:"不辣",
 ing:["250g fresh oysters, rinsed and drained","4 tbsp sweet potato starch + 6 tbsp water","3 eggs","2 scallions, chopped","1/2 tsp salt","1/4 tsp white pepper","3 tbsp oil","Sweet chili sauce or ketchup, to serve"],
 st:["Mix sweet potato starch with water, scallion, salt and pepper into a batter. Gently fold in the oysters.","Heat oil in a flat pan over medium-high heat, pour in the batter, spread thin.","Fry 2-3 minutes until the edges turn translucent and crisp.","Beat eggs, pour over the pancake, tilt to spread, fry another 2 minutes.","Flip carefully, fry 1 more minute. Serve with sweet chili sauce."],img:"img/海蛎煎.jpg"},
{cn:"姜母鸭",en:"Ginger Duck (Jiang Mu Ya)",cat:"fujian",type:"炖菜",spicy:"不辣",
 ing:["half duck, cut into chunks (about 800g)","150g old ginger, sliced thick","3 tbsp sesame oil","3 tbsp cooking wine","2 tbsp light soy sauce","1 tbsp dark soy sauce","1 tbsp sugar","5 cups water"],
 st:["Blanch duck chunks 3 minutes, rinse, drain.","Heat sesame oil over LOW heat (it burns easily), add ginger slices, slow-fry 5 minutes until edges curl.","Raise heat, add duck, stir-fry until skin browns and fat renders.","Add wine, soy sauces, sugar and water, bring to boil.","Simmer covered on low heat 60 minutes until duck is tender and sauce is reduced and glossy. Serve."],img:"img/姜母鸭.jpg"},
{cn:"酸菜鱼",en:"Pickled Cabbage Fish (Suan Cai Yu)",cat:"hot",type:"炖菜",spicy:"微辣",
 ing:["500g fish fillets (grass carp / basa / sea bass), sliced thin","300g pickled mustard cabbage (suancai), squeezed and cut into sections","10 Sichuan peppercorns","3 dried chilies","4 slices ginger","6 cloves garlic, sliced","1 egg white","2 tbsp cornstarch","1 tbsp cooking wine","1.5L chicken stock","3 tbsp oil","1 tsp salt"],
 mar:"Marinate fish slices: 1/2 tsp salt + 1 egg white + 2 tbsp cornstarch + 1 tbsp cooking wine, mix gently, rest 15 minutes. This keeps the fish silky.",
 st:["Marinate fish slices (see note above).","Heat oil, stir-fry half the garlic, ginger, Sichuan peppercorns and dried chilies until fragrant.","Add pickled cabbage, stir-fry 2 minutes.","Pour in stock, bring to a boil, simmer 5 minutes. Season with salt.","Turn heat to a gentle simmer, add fish slices one by one, cook 2 minutes until just opaque. Do NOT over-stir.","Pour everything into a serving bowl. Optional: top with garlic slices and pour 2 tbsp hot oil over. Serve."],img:"img/酸菜鱼.jpg"},
{cn:"水煮鱼",en:"Boiled Fish in Chili Oil",cat:"hot",type:"炖菜",spicy:"重辣",
 ing:["600g fish fillets, sliced","200g bean sprouts","200g lettuce or celery, cut into sections","3 tbsp doubanjiang (fermented chili bean paste)","2 tbsp dried chili flakes","1 tbsp Sichuan peppercorns","4 slices ginger","1 egg white","2 tbsp cornstarch","1.5L stock","5 tbsp oil"],
 mar:"Marinate fish: 1/2 tsp salt + egg white + cornstarch, rest 15 minutes.",
 st:["Marinate fish (see note).","Blanch bean sprouts and vegetables 1 minute, spread at the bottom of a deep bowl.","Heat 2 tbsp oil, fry doubanjiang and ginger until red oil comes out, add stock, boil 5 minutes, strain out solids (optional).","Slide in fish slices, cook 2 minutes until opaque, pour fish and broth over the vegetables.","Top with chili flakes and Sichuan peppercorns. Heat 3 tbsp oil until smoking, pour over. Serve."],img:"img/水煮鱼.jpg"},
{cn:"毛血旺",en:"Mao Xue Wang (Spicy Blood Curd & Tripe Stew)",cat:"hot",type:"炖菜",spicy:"重辣",
 ing:["300g duck blood curd (or pig blood), cubed and blanched","150g beef tripe, sliced","150g luncheon meat, sliced","100g bean sprouts","100g enoki mushrooms","2 tbsp doubanjiang","1 tbsp dried chili flakes","1 tbsp Sichuan peppercorns","4 cloves garlic, sliced","1L chicken stock","4 tbsp oil"],
 st:["Blanch bean sprouts and enoki 1 minute, spread at the bottom of a deep bowl.","Heat 2 tbsp oil, fry doubanjiang and half the garlic until fragrant, add stock, boil 3 minutes.","Add blood curd, tripe and luncheon meat, simmer 3 minutes. Pour everything over the vegetables.","Top with chili flakes, Sichuan peppercorns and remaining garlic.","Heat 2 tbsp oil until smoking, pour over the top. Serve."],img:"img/毛血旺.jpg"},
{cn:"十三香小龙虾",en:"Thirteen-Spice Crayfish",cat:"hot",type:"炒菜",spicy:"中辣",
 ing:["1kg crayfish, scrubbed, vein removed","2 tbsp thirteen-spice crayfish powder (market seasoning pack)","3 cloves garlic","4 slices ginger","2 dried chilies","1 star anise","1 bottle (330ml) beer","2 tbsp soy sauce","1 tbsp sugar","4 tbsp oil"],
 st:["Heat oil, stir-fry garlic, ginger, chilies and star anise until fragrant.","Add crayfish, stir-fry 2 minutes until shells turn bright red.","Add thirteen-spice powder, soy sauce, sugar and the whole bottle of beer.","Simmer covered on medium heat 12-15 minutes.","Uncover, reduce sauce slightly, serve hot. Eat by peeling the shells."],img:"img/十三香小龙虾.jpg"},
{cn:"蒜蓉小龙虾",en:"Garlic Crayfish",cat:"hot",type:"炒菜",spicy:"不辣",
 ing:["1kg crayfish, scrubbed","2 whole garlic heads, minced (split into 2 portions)","1 tbsp oyster sauce","1 tbsp soy sauce","1 tsp sugar","1 bottle (330ml) beer","3 tbsp oil","2 scallions"],
 st:["Heat oil, fry half the minced garlic until golden and fragrant (medium heat, do not burn).","Add crayfish, stir-fry 2 minutes until red.","Add beer, oyster sauce, soy sauce and sugar, simmer covered 12-15 minutes.","Add the remaining raw garlic in the last 2 minutes (this keeps the garlic flavor fresh and punchy).","Sprinkle scallions, serve."],img:"img/蒜蓉小龙虾.jpg"},
{cn:"胡辣汤",en:"Spicy Pepper Soup (Hu La Tang)",cat:"hot",type:"汤",spicy:"中辣",
 ing:["100g beef, shredded","1/2 block firm tofu, shredded","50g wood ear mushrooms, shredded","1 carrot, shredded","30g sweet potato vermicelli, soaked","1 tbsp black pepper, freshly ground","1-2 tsp chili oil (to taste)","3 tbsp vinegar","2 tbsp sweet potato starch + 4 tbsp water","1.2L beef stock","1 tsp salt","1 egg, beaten (optional)"],
 st:["Bring stock to a boil, add beef, tofu, wood ear and carrot, simmer 5 minutes.","Add soaked vermicelli, cook 2 minutes.","Season with salt, black pepper and chili oil. The pepper flavor should be prominent and warming.","Restir the starch water and pour in slowly while stirring; the soup should be thick like runny porridge.","Drizzle beaten egg if using, turn off heat, add vinegar, stir once. Serve hot."],img:"img/胡辣汤.jpg"},
{cn:"剁椒鱼头",en:"Steamed Fish Head with Chopped Chili",cat:"hot",type:"蒸菜",spicy:"重辣",
 ing:["1 bighead carp head or large fish head, split in half (about 800g)","4 tbsp chopped salted chili (duo jiao)","4 slices ginger","4 cloves garlic, minced","1 tbsp cooking wine","1 tbsp steamed-fish soy sauce","2 tbsp oil","2 scallions, shredded"],
 st:["Rinse fish head, rub with wine, place cut-side up on a deep plate.","Mix chopped chili with garlic, half the ginger and 1 tbsp oil, spread generously over the fish.","Steam over high heat 12 minutes.","Discard steaming liquid, top with shredded scallion and remaining ginger.","Heat 1 tbsp oil with steamed-fish soy sauce until hot, pour over. Serve. The cheek meat is the best part."],img:"img/剁椒鱼头.jpg"},
{cn:"太子参瘦肉汤",en:"Pseudostellaria & Lean Pork Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"孩子长高 · 健脾益气",
 ing:["15g pseudostellaria root (tai zi shen)","300g lean pork, sliced or cubed","3 red dates","2 slices ginger","6 cups water","1 tsp salt"],
 st:["Rinse herbs. Blanch pork 2 minutes.","Put everything except salt in a pot, bring to boil, skim foam.","Simmer covered on low heat for 90 minutes.","Season with salt, serve. Good for kids: strengthens the spleen and builds energy."],img:"img/太子参瘦肉汤.jpg"},
{cn:"淮山芡实排骨汤",en:"Huai Shan & Euryale Rib Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"孩子长高 · 健脾益肾",
 ing:["20g dried huai shan (Chinese yam slices) or 300g fresh yam","15g euryale seeds (qian shi)","10g lotus seeds","500g pork ribs","3 red dates","3 slices ginger","8 cups water","1 tsp salt"],
 st:["Blanch ribs 3 minutes, rinse.","Add ribs, herbs, dates, ginger and water to a pot, bring to boil.","Simmer covered 90 minutes (60 minutes if using fresh yam, add it in the last 20 minutes).","Season with salt, serve. Nourishes spleen and kidneys, helps kids grow."],img:"img/淮山芡实排骨汤.jpg"},
{cn:"胡萝卜玉米排骨汤",en:"Carrot & Corn Rib Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"孩子长高 · 补充维生素",
 ing:["500g pork ribs","1 carrot, cut into chunks","1 sweet corn, cut into sections","3 slices ginger","8 cups water","1 tsp salt"],
 st:["Blanch ribs 3 minutes, rinse.","Boil ribs, ginger and water, skim foam, simmer 50 minutes.","Add carrot and corn, simmer 25 minutes until sweet and tender.","Season with salt, serve. A kid-favorite: naturally sweet."],img:"img/胡萝卜玉米排骨汤.jpg"},
{cn:"黄豆猪蹄汤",en:"Soybean & Pig Trotter Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"孩子长高 · 补钙补胶原",
 ing:["1 pig trotter, chopped into pieces","100g dried soybeans, soaked 4 hours or overnight","3 slices ginger","1 tbsp cooking wine","10 cups water","1 tsp salt"],
 st:["Blanch trotter pieces 5 minutes, rinse and pluck any remaining hair.","Put trotters, soaked soybeans, ginger, wine and water in a pot, bring to boil.","Simmer covered on low heat for 2 hours until trotter is soft and the soup is milky.","Season with salt, serve. Rich in calcium and collagen."],img:"img/黄豆猪蹄汤.jpg"},
{cn:"鲫鱼豆腐汤",en:"Crucian Carp & Tofu Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"孩子长高 · 助消化补蛋白",
 ing:["1 crucian carp (about 400g), cleaned","300g soft tofu, cubed","3 slices ginger","2 scallions","1 tbsp cooking wine","2 tbsp oil","6 cups hot water","1 tsp salt"],
 st:["Dry the fish, heat oil, pan-fry fish 2 minutes per side until golden (this makes the soup milky white).","Add ginger, scallion, wine and HOT water, bring to a rolling boil.","Boil 10 minutes — the soup will turn milky white.","Add tofu, simmer 10 more minutes.","Season with salt, serve. High-quality protein, easy to digest."],img:"img/鲫鱼豆腐汤.jpg"},
{cn:"板栗鸡汤",en:"Chestnut & Chicken Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"孩子长高 · 健脾补肾",
 ing:["half chicken, cut into chunks","300g shelled chestnuts (frozen or fresh, peeled)","3 red dates","3 slices ginger","8 cups water","1 tsp salt"],
 st:["Blanch chicken 3 minutes, rinse.","Boil chicken, chestnuts, dates, ginger and water, skim foam.","Simmer covered 70 minutes until chestnuts are soft and starchy.","Season with salt, serve. Sweet chestnuts make this kids' favorite."],img:"img/板栗鸡汤.jpg"},
{cn:"猴头菇鸡汤",en:"Lion's Mane Mushroom & Chicken Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"养胃助消化 · 增强免疫",
 ing:["30g dried lion's mane mushrooms (hou tou gu)","half chicken, cut into chunks","4 red dates","3 slices ginger","8 cups water","1 tsp salt"],
 st:["Soak dried mushrooms in warm water 2 hours until soft. Squeeze out the yellowish bitter water, repeat 2-3 times, then cut off the hard root and tear into pieces.","Blanch chicken 3 minutes, rinse.","Boil chicken, mushrooms, dates, ginger and water, skim foam.","Simmer covered 90 minutes.","Season with salt, serve. Famous for nourishing the stomach."],img:"img/猴头菇鸡汤.jpg"},
{cn:"山楂陈皮排骨汤",en:"Hawthorn & Tangerine Peel Rib Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"开胃助消化 · 解腻",
 ing:["500g pork ribs","15g dried hawthorn slices","5g dried tangerine peel","2 slices ginger","8 cups water","1 tsp salt"],
 st:["Blanch ribs 3 minutes, rinse.","Rinse hawthorn and tangerine peel.","Boil everything except salt, skim foam, simmer covered 80 minutes.","Season with salt, serve. Slightly tangy — opens the appetite and cuts greasiness."],img:"img/山楂陈皮排骨汤.jpg"},
{cn:"冬瓜薏米排骨汤",en:"Winter Melon & Barley Rib Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"清热祛湿 · 助消化",
 ing:["500g pork ribs","400g winter melon, chunked","30g coix seeds (yi mi / barley), soaked 1 hour","3 slices ginger","8 cups water","1 tsp salt"],
 st:["Blanch ribs 3 minutes, rinse.","Boil ribs, soaked barley and ginger for 50 minutes.","Add winter melon, simmer 20 minutes until translucent.","Season with salt, serve. Cooling and dehumidifying — best in hot, humid weather."],img:"img/冬瓜薏米排骨汤.jpg"},
{cn:"佛手瓜排骨汤",en:"Chayote & Pork Rib Soup",cat:"soup",type:"汤",spicy:"不辣",ben:"开胃助消化",
 ing:["500g pork ribs","1 chayote (fo shou gua), peeled and chunked","3 slices ginger","2 scallions","8 cups water","1 tsp salt"],
 st:["Blanch ribs 3 minutes, rinse.","Boil ribs, ginger and water, skim foam, simmer 50 minutes.","Add chayote chunks, simmer 15 minutes until tender and clear.","Season with salt, sprinkle scallions, serve. Mild, light and gentle on the stomach."],img:"img/佛手瓜排骨汤.jpg"},
{cn:"红烧鱼",en:"Braised Fish",cat:"fujian",type:"炒菜",spicy:"不辣",mar:"Mix 2 tsp chicken bouillon, 1 tsp sugar, 1 tsp salt, 1 tsp light soy sauce, 3 slices ginger (minced). Coat fish, marinate 15 min, then dredge in flour before frying.",
 ing:["1 fish (cleaned, cut into pieces), about 600g","2 tsp chicken bouillon powder","1 tsp sugar","1 tsp salt","1 tsp light soy sauce","3 slices ginger, minced","All-purpose flour, for coating","Cooking oil, for pan-frying"],
 st:["Clean the fish and cut into serving pieces.","Mix chicken bouillon, sugar, salt, soy sauce and minced ginger. Coat fish evenly and marinate 15 minutes.","Dredge marinated fish pieces in flour.","Heat oil in a pan over medium heat. Fry fish until golden on both sides. Serve."],img:"img/红烧鱼.jpg"},
{cn:"鱼汤",en:"Fish Soup",cat:"fujian",type:"汤",spicy:"不辣",
 ing:["1 fish (whole or pieces), about 500g","3 slices ginger","4 cloves garlic","6 segments green garlic whites","1 tsp salt","2 tsp chicken bouillon","1 tbsp cooking wine","A pinch of sugar","Garlic sprouts, cut into sections","2 tbsp cooking oil","4 cups water"],
 st:["Heat oil in a pot. Add ginger, garlic and green garlic whites. Stir-fry until fragrant.","Add water and bring to a boil.","Add fish. Season with salt, chicken bouillon, cooking wine and sugar.","Lower to medium-low heat and simmer 12 minutes.","Add garlic sprout sections. Serve hot."],img:"img/鱼汤.jpg"},
{cn:"炒蛏子",en:"Stir-fried Razor Clams",cat:"fujian",type:"炒菜",spicy:"中辣",
 ing:["500g razor clams","5 cloves garlic","5 slices ginger, cut into thin strips","2 bird's eye chilies","2 tsp chicken bouillon","1 tsp sugar","1 tsp salt","2 tsp oyster sauce","Scallions, chopped","2 tbsp cooking oil"],
 st:["Heat oil in a wok. Add garlic, ginger strips and chilies. Stir-fry until fragrant.","Add razor clams. Season with chicken bouillon, sugar, salt and oyster sauce.","Stir-fry 3 minutes until clams open.","Add scallions, toss briefly. Serve."],img:"img/炒蛏子.jpg"},
{cn:"五指毛桃牛骨汤",en:"Five-leaf Ginseng Beef Bone Soup",cat:"fujian",type:"汤",spicy:"不辣",ben:"健脾益气",herb:true,mar:"Blanch beef ribs in cold water first to remove blood and scum. Rinse herbs quickly — do not soak for long.",
 ing:["450g beef ribs","15g five-leaf ginseng (wu zhi mao tao)","8g codonopsis (dang shen)","6g poria (fu ling)","1 piece dried tangerine peel (chen pi)","5g Solomon's seal (yu zhu)","2 red dates, cut open and pitted","Water, for stewing","Salt, to taste"],
 st:["Blanch beef ribs in cold water to remove blood and scum. Drain and rinse.","Quickly rinse all herbs — do not soak for long.","Place beef ribs and all herbs in a stewing pot. Add cold water.","Steam-stew (隔水炖) for 1.5 to 2 hours.","Season with salt before serving."],img:"img/五指毛桃牛骨汤.jpg"},
{cn:"猪肚汤（四神风味）",en:"Pork Tripe Soup (Four-Herb Style)",cat:"fujian",type:"汤",spicy:"不辣",ben:"健脾养胃",herb:true,mar:"Clean pork tripe thoroughly and blanch in cold water to remove scum. Rinse herbs quickly — do not soak for long.",
 ing:["Half pork tripe, about 400g, cleaned","12g dried Chinese yam (huai shan)","10g poria (fu ling)","10g euryale seeds (qian shi)","10g lotus seeds, core removed to prevent bitterness","6g codonopsis (dang shen)","3 slices ginger","Water, for stewing","Salt, to taste"],
 st:["Clean pork tripe thoroughly. Blanch in cold water to remove scum. Drain and rinse.","Quickly rinse all herbs — do not soak for long. Remove lotus seed cores.","Place pork tripe, all herbs and ginger in a stewing pot. Add cold water.","Steam-stew (隔水炖) for 1.5 to 2 hours.","Season with salt before serving."],img:"img/猪肚汤（四神风味）.jpg"},
{cn:"金线莲小肠汤",en:"Jinxianlian Pork Intestine Soup",cat:"fujian",type:"汤",spicy:"不辣",ben:"清热利咽",herb:true,mar:"Blanch pork intestines in cold water to remove blood and scum. Rinse Jinxianlian briefly — do not over-wash, active compounds are easily lost.",
 ing:["400g pork intestines, cleaned","5g dried Jinxianlian (jin xian lian)","8g poria (fu ling)","6g Solomon's seal (yu zhu)","2 small pieces licorice (gan cao)","1 small piece dried tangerine peel (chen pi)","2 slices ginger","Water, for stewing","Salt, to taste"],
 st:["Blanch pork intestines in cold water to remove blood and scum. Drain and rinse.","Briefly rinse all herbs — do not soak. Jinxianlian especially: do not over-wash.","Place intestines, all herbs and ginger in a stewing pot. Add cold water.","Steam-stew (隔水炖) for 1.5 to 2 hours.","Add salt before serving."],img:"img/金线莲小肠汤.jpg"},
{cn:"平湖鱼汤",en:"Pinghu Fish Soup",cat:"fujian",type:"汤",spicy:"不辣",
 ing:["1 fish, about 500g, cut into pieces","3 tbsp sweet potato starch","1 tsp salt","1 tsp sugar","Minced ginger","2 tbsp cooking oil","1 tbsp soy sauce","2 tsp sugar","2 tsp vinegar","Garlic sprouts, cut into sections","4 cups water"],
 st:["Clean the fish and cut into pieces.","Mix sweet potato starch with salt and sugar. Coat fish pieces evenly.","Heat oil in a pot. Fry minced ginger briefly until fragrant.","Add water and bring to a boil.","Add soy sauce, salt, 2 tsp sugar and 2 tsp vinegar.","Add fish and cook until done.","Ladle into bowls, top with garlic sprouts. Serve."],img:"img/平湖鱼汤.jpg"},
{cn:"目鱼汤",en:"Cuttlefish Soup",cat:"fujian",type:"汤",spicy:"不辣",mar:"Soak cuttlefish in alkaline water overnight (1 liang alkaline block per 500g cuttlefish, dissolved in hot water). Blanch in boiling water before cooking.",
 ing:["500g cuttlefish (mu yu)","50g alkaline block (jian kuai)","Minced ginger","2 tbsp cooking oil","1 tbsp soy sauce","Salt, to taste","2 tsp sugar","2 tsp vinegar","2 tbsp cornstarch slurry","Garlic sprouts, cut into sections","4 cups water"],
 st:["Dissolve alkaline block in hot water. Soak cuttlefish overnight.","Rinse cuttlefish and blanch in boiling water. Drain.","Heat oil in a pot. Fry minced ginger briefly until fragrant.","Add water and bring to a boil.","Add soy sauce, salt, sugar and vinegar.","Add cuttlefish and cook briefly.","Thicken with cornstarch slurry.","Ladle into bowls, top with garlic sprouts. Serve."],img:"img/目鱼汤.jpg"},
{cn:"西洋参炖猪心",en:"American Ginseng Stewed Pig Heart Soup",cat:"fujian",type:"汤",spicy:"不辣",ben:"安神养心",mar:"Clean the pig heart thoroughly: trim off blood vessels and excess fat so the soup stays clear. Simmer at least 2 hours to fully extract the ginseng.",
 ing:["1 pig heart (about 300-400g)","American ginseng (xi yang shen), 3-4 slices","2 slices ginger","A pinch of goji berries","Salt, to taste","Water, as needed"],
 st:["Clean the pig heart, remove surface blood clots and fat, rinse well.","Stuff the ginseng slices inside the heart cavity, add 2 slices of ginger.","Put the heart in a stew pot (or steaming bowl), add water, steam-stew (隔水炖) for 2 hours.","Take the heart out, slice into bite-size pieces.","Return the pieces to the soup, add goji berries and salt, serve. Calming and nourishing for the mind."],img:"img/西洋参炖猪心.jpg"},

 st:["Rinse red beans, then soak overnight or freeze.","Cook beans in water until very soft.","Knead glutinous rice flour with sugar and warm water into a dough; roll small balls, boil until cooked, cool in cold water.","Blend part of the beans into paste, return to pot, simmer with sugar and condensed milk until smooth.","Serve the red bean paste with rice balls, sprinkle dried osmanthus."]},

 ing:["1 cup (100g) all-purpose flour","2 cups (250g) water","3 eggs","2 scallions, chopped","Carrot, finely diced","1 tsp salt","1/2 tsp thirteen-spice powder (shi san xiang)","Cooking oil"],
 st:["Whisk flour and water into a smooth, pourable batter.","Strain the batter, then mix in salt, thirteen-spice, scallions, carrot dice and eggs.","Brush a flat pan with oil, pour batter on medium-low heat.","Flip when one side is set and golden; cook until done."]},

{cn:"清炒西葫芦",en:"Stir-fried Zucchini",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["2 zucchinis (about 400g), halved and sliced thin","2 cloves garlic, sliced","1 tbsp cooking oil","1/2 tsp salt","A pinch of chicken bouillon (optional)"],
 st:["Slice zucchini into half-moon pieces about 3mm thick.","Heat oil in a wok over medium-high heat, stir-fry garlic until fragrant.","Add zucchini, stir-fry 2-3 minutes until just tender but still crisp.","Season with salt and bouillon, toss once more and serve. Do not overcook - it releases water and turns mushy."],img:"img/清炒西葫芦.jpg"},
{cn:"佛手瓜炒鸡蛋",en:"Chayote with Scrambled Eggs",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["1 chayote (fo shou gua, about 300g), halved, pitted and sliced thin","3 eggs","1 clove garlic, sliced","1 tbsp cooking oil","1/2 tsp salt","White pepper, a pinch"],
 st:["Beat eggs with a pinch of salt and white pepper.","Heat oil, scramble eggs until just set, remove and set aside.","Add a little more oil, stir-fry garlic, then chayote slices 2 minutes over high heat.","Return eggs, season with salt, toss quickly and serve."],img:"img/佛手瓜炒鸡蛋.jpg"},
{cn:"煎水嫩鸡排",en:"Pan-fried Tender Chicken Breast",cat:"home",type:"其他",spicy:"不辣",mar:"Marinate at least 30 minutes (or freeze in portions for busy mornings): butterfly chicken breast, pound thin, then add 1/4 tsp baking soda + 1 tbsp water, rest 15 min, rinse and pat dry; then marinate with salt, white pepper, 1 egg white, 1 tbsp cornstarch and 1 tsp oil.",
 ing:["2 chicken breasts, butterflied and pounded to 1cm thick","1/4 tsp baking soda (tenderizing)","1 egg white","1 tbsp cornstarch","1/2 tsp salt","White pepper","1 tsp cooking oil (for marinade)","2 tbsp oil for pan-frying"],
 st:["Tenderize chicken with baking soda method (see prep note above).","Marinate with salt, white pepper, egg white, cornstarch and oil for 30 minutes.","Heat 2 tbsp oil in a flat pan over medium heat, pan-fry chicken 3-4 minutes per side until golden and cooked through.","Rest 2 minutes, slice and serve. Great with pancakes or eggs for breakfast.","Tip from the video: marinate a big batch, freeze between parchment paper, pan-fry straight from freezer on weekday mornings."],img:"img/煎水嫩鸡排.jpg"},
{cn:"咸蛋黄豆腐虾仁菌菇汤",en:"Salted Egg Yolk, Tofu, Shrimp & Mushroom Soup",cat:"home",type:"汤",spicy:"不辣",mar:"Use boiling water (not cold) when adding to the fried salted yolk - it makes the soup milky and fragrant. Salted yolks mash easier after steaming 5 minutes.",
 ing:["3 salted duck egg yolks, steamed and mashed","300g firm tofu, cut into cubes","200g shrimp, peeled and deveined","150g mixed mushrooms (king oyster or white beech), torn","1 tbsp oil or lard","2 slices ginger","3 cups boiling water","Salt and white pepper, to taste","Chopped scallions"],
 st:["Steam salted yolks 5 minutes, mash into a paste.","Heat oil (or lard) in a pot, fry ginger, then mash and fry the salted yolks over low heat until foamy and sandy.","Add boiling water, bring to a rolling boil - the soup turns milky.","Add mushrooms, simmer 3 minutes, then tofu cubes, simmer 2 minutes.","Add shrimp, cook until just pink (about 1 minute).","Season lightly with salt (yolks are already salty) and white pepper, top with scallions and serve."],img:"img/咸蛋黄豆腐虾仁菌菇汤.jpg"},
{cn:"清炒芦笋口蘑虾",en:"Stir-fried Asparagus, Mushroom & Shrimp",cat:"home",type:"炒菜",spicy:"不辣",mar:"Marinate shrimp 10 minutes: a pinch of salt, white pepper, 1 tsp cornstarch, 1 tsp cooking oil. Blanch asparagus 30 seconds in salted boiling water to keep it vivid green.",
 ing:["250g shrimp, peeled and deveined","1 bunch asparagus (about 200g), woody ends trimmed, cut into sections","4-5 white button or king oyster mushrooms, sliced","2 cloves garlic, sliced","1 tbsp cooking oil","1/2 tsp salt","A pinch of white pepper"],
 st:["Marinate shrimp (see prep note) and blanch asparagus 30 seconds, drain.","Heat oil over high heat, stir-fry garlic and mushrooms 1 minute until fragrant.","Add shrimp, stir-fry until they just curl and turn pink.","Add asparagus, salt and white pepper, toss 30 seconds and serve immediately. Low-calorie and light."],img:"img/清炒芦笋口蘑虾.jpg"},
{cn:"肉糜炖蛋",en:"Steamed Egg Custard with Minced Pork",cat:"home",type:"蒸菜",spicy:"不辣",mar:"Use warm water (about 40C) for the egg mixture, ratio 1:1.5 eggs to water. Sieve the mixture for a silky surface. Cover the bowl with a plate while steaming.",
 ing:["3 eggs","120g ground pork (coarse grind is better)","1.5 cups warm water (1.5x the egg volume)","1 tsp light soy sauce","1/2 tsp sesame oil","1/4 tsp salt","Minced ginger, a small pinch"],
 st:["Mix ground pork with ginger, 1/4 tsp salt and a splash of soy sauce, spread flat on a deep bowl.","Beat eggs with warm water and salt, sieve over the pork to remove bubbles.","Cover the bowl with a plate or foil.","Steam over medium-low heat for 12-14 minutes until set (a chopstick inserted comes out clean).","Drizzle light soy sauce and sesame oil, serve hot."],img:"img/肉糜炖蛋.jpg"},
{cn:"海鲜粥",en:"Seafood Congee",cat:"fujian",type:"主食",spicy:"不辣",
 ing:["1.5 cups rice","Pork ribs, a small amount","Dried shrimp, a small amount","5 dried scallops","Crab, as needed","Shrimp, as needed","2 spoonfuls salt","3 spoonfuls chicken bouillon powder","Chopped cilantro","Chopped scallions"],
 st:["Simmer 1½ cups of rice with pork ribs, a small amount of dried shrimp, and 5 dried scallops.","Once the congee is fully cooked, add the crab and shrimp and boil for another 10 minutes.","Add 2 spoonfuls of salt, 3 spoonfuls of chicken bouillon powder, chopped cilantro, and chopped scallions. Stir well."],img:"img/海鲜粥.jpg"},
{cn:"爆炒猪腰",en:"Stir-Fried Pork Kidneys",cat:"home",type:"炒菜",spicy:"微辣",
 ing:["Pork kidneys, as needed","1 tsp salt","1 tsp chicken bouillon powder","Minced ginger","1 tsp light soy sauce","1 tsp dark soy sauce","1 tsp oyster sauce","A dash of sesame oil","A little white vinegar","Cornstarch","Minced garlic","Chopped scallions","2 chopped chili peppers","1 bell pepper"],
 st:["Rinse the pork kidneys several times in cold water until the water runs clear, then soak them in cold water for 10 minutes.","Drain well. Add 1 teaspoon salt, 1 teaspoon chicken bouillon powder, minced ginger, 1 teaspoon light soy sauce, 1 teaspoon dark soy sauce, 1 teaspoon oyster sauce, a dash of sesame oil, and a little white vinegar. Add cornstarch, mix well, and marinate for 5 minutes.","Prepare minced ginger, minced garlic, chopped scallions, 2 chopped chili peppers, and 1 bell pepper.","Transfer the marinated pork kidneys to a separate plate and reserve the marinade.","Heat oil until very hot. Add the pork kidneys and stir-fry until they change color and curl up, then remove them from the pan.","Add more oil if needed, then add all the prepared vegetables and aromatics. Stir-fry until fragrant. Add ½ spoonful of dark soy sauce. Return the pork kidneys to the pan and stir-fry for about 10 seconds. Pour in the reserved marinade, toss briefly, and serve."],img:"img/爆炒猪腰.jpg"},
{cn:"冬瓜花蛤汤",en:"Winter Melon and Clam Soup",cat:"fujian",type:"汤",spicy:"不辣",
 ing:["Clams, as needed","Sliced ginger","Cooking wine","Winter melon, sliced","Water, enough to cover","Salt, to taste","Pepper, to taste","Chopped cilantro"],
 st:["Boil the clams with sliced ginger and cooking wine until the shells open. Remove the clams and set aside.","Heat oil in a pot and sauté the ginger slices. Add the winter melon, pour in enough water to cover, and simmer for 10 minutes.","Add the clams and simmer for another 3 minutes.","Season with salt and pepper, then garnish with chopped cilantro."],img:"img/冬瓜花蛤汤.jpg"},
{cn:"葱油蛏子",en:"Scallion-Oil Razor Clams",cat:"fujian",type:"炒菜",spicy:"不辣",
 ing:["Razor clams, as needed","2 spoonfuls salt (for soaking)","Scallions, shredded + segments","Ginger","Cooking wine","Oyster sauce","Cooking oil"],
 st:["Place the razor clams in a bowl of water. Add 2 spoonfuls of salt, stir, and soak for 1 hour.","After 1 hour, rinse the razor clams thoroughly.","Bring a pot of water to a boil with scallions, ginger, and cooking wine.","Once the water is boiling, add the razor clams.","When the shells open, remove the shells and trim away the dark edges. Arrange the clam meat on a plate and top with shredded scallions.","Heat oil in a pan and add scallions. Sauté until fragrant, then add oyster sauce.","When the sauce starts to bubble, pour it over the razor clams."],img:"img/葱油蛏子.jpg"},
{cn:"清炒小芥菜",en:"Stir-Fried Baby Mustard",cat:"fujian",type:"炒菜",spicy:"不辣",
 ing:["Baby mustard, sliced","Sliced ginger","Garlic","Salt","Chicken bouillon powder","Cooking oil"],
 st:["Heat oil in a pan. Add sliced ginger and garlic and cook until fragrant.","Add the sliced baby mustard and stir-fry.","Season with salt and chicken bouillon powder. Stir-fry briefly and serve."],img:"img/清炒小芥菜.jpg"},
{cn:"肉末茄子",en:"Sautéed Eggplant with Minced Pork",cat:"home",type:"炒菜",spicy:"不辣",
 ing:["Eggplant","2 spoonfuls salt (for salting)","2 tbsp minced garlic","1 tbsp light soy sauce","1/2 tbsp dark soy sauce","1/2 tbsp oyster sauce","1 tbsp sugar","1/2 tbsp salt","Cornstarch","Minced pork","Cooking oil"],
 st:["Cut the eggplant into pieces. Sprinkle with 2 spoonfuls of salt and let sit for 10 minutes.","Make the sauce by mixing 2 tablespoons minced garlic, 1 tablespoon light soy sauce, ½ tablespoon dark soy sauce, ½ tablespoon oyster sauce, 1 tablespoon sugar, and ½ tablespoon salt.","Rinse the eggplant.","Add cornstarch and toss until evenly coated.","Fry the eggplant in hot oil until cooked through, then drain off the excess oil.","Pour in the prepared sauce, toss well, and serve."],img:"img/肉末茄子.jpg"},
{cn:"柠檬黄油烤鳕鱼",en:"Baked Cod with Lemon-Garlic Butter",cat:"home",type:"其他",spicy:"不辣",
 ing:["500 g cod fillets","50 g butter","1 lemon","4 garlic cloves","Parsley","Salt","Black pepper"],
 st:["Make the sauce by mixing 4 minced garlic cloves, the juice of half a lemon, minced parsley, and 50 g butter.","Place the cod fillets in a baking dish and season with salt and black pepper.","Pour the butter sauce over the cod. Arrange lemon slices on top and cover tightly with aluminum foil.","Preheat the oven to 200°C (about 400°F).","Bake for 15 minutes, then remove the foil.","Bake for another 5 minutes and serve."],img:"img/柠檬黄油烤鳕鱼.jpg"},
