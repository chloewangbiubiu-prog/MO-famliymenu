<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭菜谱 · 菜品选择清单</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2620; --sub:#8a8378;
    --line:#e8e3d9; --accent:#c0392b; --accent-soft:#fbeae7;
    --green:#27ae60; --green-soft:#e8f6ee; --red:#c0392b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6;}
  .wrap{max-width:960px; margin:0 auto; padding:24px 16px 80px;}
  header{text-align:center; padding:28px 0 8px;}
  header h1{font-size:26px; letter-spacing:1px;}
  header h1 .dot{color:var(--accent);}
  header p{color:var(--sub); font-size:14px; margin-top:6px;}
  .toolbar{position:sticky; top:0; background:var(--bg); padding:12px 0 10px; z-index:10; border-bottom:1px solid var(--line);}
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px;}
  .pill{border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; user-select:none; transition:all .15s;}
  .pill:hover{border-color:var(--accent);}
  .pill.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  select, input[type=text]{border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 10px; font-size:13px; color:var(--ink); outline:none;}
  select:focus, input[type=text]:focus{border-color:var(--accent);}
  #search{flex:1; min-width:150px;}
  .stats{margin-left:auto; font-size:13px; color:var(--sub); white-space:nowrap;}
  .stats b{color:var(--accent);}
  .btn{border:none; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; font-weight:600;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:#a93226;}
  .btn-ghost{background:var(--card); border:1px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
  .region{margin-top:22px;}
  .region h2{font-size:17px; padding:8px 12px; border-left:4px solid var(--accent); background:var(--card); border-radius:0 8px 8px 0; display:flex; align-items:center; gap:10px;}
  .region h2 .cnt{font-size:12px; color:var(--sub); font-weight:normal;}
  .region h2 .pick{font-size:12px; color:var(--green); font-weight:600;}
  .dish{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-top:8px; cursor:pointer; transition:all .15s;}
  .dish:hover{border-color:var(--accent);}
  .dish.checked{border-color:var(--green); background:var(--green-soft);}
  .dish .box{width:20px; height:20px; border:2px solid var(--line); border-radius:5px; flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent; transition:all .15s;}
  .dish.checked .box{background:var(--green); border-color:var(--green); color:#fff;}
  .dish .name{font-size:15px; font-weight:600; flex:none;}
  .dish .en{font-size:13px; color:var(--sub); flex:1; min-width:120px;}
  .tags{display:flex; gap:6px; flex:none;}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px; background:#f0ede6; color:#6b645a;}
  .tag.tang{background:#e8f0fb; color:#2c5f9e;}
  .tag.chao{background:#fdf0e2; color:#b06a1c;}
  .tag.dun{background:#f5e8f0; color:#8e4a72;}
  .tag.zheng{background:#e6f4f0; color:#1d7a5f;}
  .tag.zhushi{background:#f5efe0; color:#8a6d1f;}
  .tag.tianpin{background:#fbe8ea; color:#b0404c;}
  .tag.qita{background:#ece8f4; color:#5a4a8a;}
  .tag.la0{background:#eef2ea; color:#5f7a3d;}
  .tag.la1{background:#fff3d6; color:#c07f00;}
  .tag.la2{background:#fde3dd; color:#c0392b;}
  .tag.la3{background:#fbd7d0; color:#a61e0d;}
  .tag.liangcai{background:#e4f4f7; color:#0f6d7a;}
  .tag.benefit{background:#e9f7ef; color:#1d7a46; border:1px dashed #7cc49a;}
  .tag.herbal{background:#f0eaf8; color:#6b3fa0;}
  .addBtn{margin-left:auto; border:none; background:var(--green); color:#fff; border-radius:999px; padding:4px 14px; font-size:12px; cursor:pointer; font-weight:600; flex:none;}
  .addBtn:hover{background:#1e9e54;}
  .delBtn{border:none; background:none; color:#c0392b; font-size:16px; cursor:pointer; line-height:1; padding:0 2px; flex:none;}
  .delBtn:hover{transform:scale(1.3);}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff; border-radius:14px; padding:22px; width:min(92vw,430px); box-shadow:0 10px 40px rgba(0,0,0,.2); max-height:90vh; overflow-y:auto;}
  .modal h3{font-size:17px; margin-bottom:4px;}
  .modal .m-sub{font-size:12px; color:var(--sub); margin-bottom:6px;}
  .modal label{display:block; font-size:13px; color:var(--sub); margin:10px 0 4px;}
  .modal input[type=text], .modal select{width:100%; padding:8px 10px; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); outline:none;}
  .modal input[type=text]:focus, .modal select:focus{border-color:var(--accent);}
  .modal .row2{display:flex; gap:10px;}
  .modal .row2 > div{flex:1;}
  .m-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px;}
  .m-actions .btn{padding:8px 18px;}
  .empty{text-align:center; color:var(--sub); padding:40px 0;}
  .output-area{margin-top:20px; display:none;}
  .output-area.show{display:block;}
  .output-area textarea{width:100%; height:200px; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13px; font-family:Consolas,monospace; background:var(--card); color:var(--ink); resize:vertical;}
  .hint{font-size:12px; color:var(--sub); margin-top:6px;}
  .banner{background:var(--accent-soft); border:1px solid #f0c9c2; border-radius:10px; padding:10px 14px; font-size:13px; color:#7a2e22; margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>家庭菜谱 · 菜品选择清单<span class="dot">。</span></h1>
    <p>共 <b id="totalCnt">0</b> 道家常菜 · 按地区/菜系分类 · 勾选你想要的，点「复制选中清单」发回给我即可</p>
  </header>

  <div class="toolbar">
    <div class="row">
      <button class="pill active" data-region="all">全部</button>
      <button class="pill" data-region="jiangzhe">江浙沪通用</button>
      <button class="pill" data-region="shanghai">上海菜</button>
      <button class="pill" data-region="mindong">闽东菜(古田)</button>
      <button class="pill" data-region="minnan">闽南菜</button>
      <button class="pill" data-region="guangdong">广东菜</button>
      <button class="pill" data-region="hot">🔥网红热门</button>
      <button class="pill" data-region="restaurant">🏮饭店招牌</button>
      <button class="pill" data-region="soup">🥣滋补汤羹</button>
    </div>
    <div class="row">
      <select id="typeFilter">
        <option value="all">全部分类</option>
        <option value="炒菜">炒菜</option>
        <option value="炖菜">炖菜</option>
        <option value="蒸菜">蒸菜</option>
        <option value="汤">汤</option>
        <option value="主食">主食</option>
        <option value="甜品">甜品</option>
        <option value="烤菜">烤菜</option>
        <option value="凉菜">凉菜</option>
        <option value="其他">其他</option>
      </select>
      <select id="spicyFilter">
        <option value="all">全部辣度</option>
        <option value="不辣">不辣</option>
        <option value="微辣">微辣</option>
        <option value="中辣">中辣</option>
        <option value="重辣">重辣</option>
      </select>
      <input type="text" id="search" placeholder="🔍 搜索菜名 / 拼音 / 英文…">
      <span class="stats">已选 <b id="pickCount">0</b> / <b id="totalCnt2">0</b></span>
    </div>
    <div class="row">
      <button class="btn btn-primary" id="copyBtn">📋 复制选中清单</button>
      <button class="btn btn-ghost" id="clearBtn">清空选择</button>
      <button class="btn btn-ghost" id="selectAllBtn">全选当前筛选</button>
    </div>
  </div>

  <div class="banner" id="banner">
    💡 <b>用法</b>：按地区点开筛选 → 勾选你吃过或想吃的菜 → 最后点「复制选中清单」，把复制的文本直接发给我。
    如果你家里已经有拿手菜谱，也可以直接在回复里补充菜名，我一起收进去。
  </div>

  <div id="list"></div>

  <div class="output-area" id="outputArea">
    <textarea id="outputText" readonly></textarea>
    <p class="hint">已复制到剪贴板（如未自动复制，可手动全选复制）。把这份清单直接发给我即可。</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>＋ 新增一道菜</h3>
    <p class="m-sub">会保存到你的浏览器里，下次打开还在；也可以随时删除。</p>
    <label>中文菜名 *</label>
    <input type="text" id="mCn" placeholder="例如：红烧狮子头">
    <label>英文菜名（给阿姨看的，尽量填）</label>
    <input type="text" id="mEn" placeholder="例如：Braised Pork Meatballs（不填会先留空，之后可补）">
    <div class="row2">
      <div>
        <label>分类</label>
        <select id="mType">
          <option>炒菜</option><option>炖菜</option><option>蒸菜</option>
          <option>汤</option><option>主食</option><option>甜品</option>
          <option>烤菜</option><option>凉菜</option><option>其他</option>
        </select>
      </div>
      <div>
        <label>辣度</label>
        <select id="mSpicy">
          <option>不辣</option><option>微辣</option><option>中辣</option><option>重辣</option>
        </select>
      </div>
    </div>
    <label>功效（补汤类填，如「孩子长高·健脾益气」「润肺止咳」，没有可留空）</label>
    <input type="text" id="mBenefit" placeholder="例如：润肺止咳">
    <div class="m-actions">
      <button class="btn btn-ghost" id="mCancel">取消</button>
      <button class="btn btn-primary" id="mSave">保存</button>
    </div>
  </div>
</div>

const TYPE_CLASS = {"炒菜":"chao","炖菜":"dun","蒸菜":"zheng","汤":"tang","主食":"zhushi","甜品":"tianpin","烤菜":"qita","凉菜":"liangcai","其他":"qita"};
const SPICY_CLASS = {"不辣":"la0","微辣":"la1","中辣":"la2","重辣":"la3"};

let customDishes = [];
try{ customDishes = JSON.parse(localStorage.getItem("familyRecipeCustomDishes")||"[]")||[]; }catch(e){}
function saveCustom(){ try{ localStorage.setItem("familyRecipeCustomDishes", JSON.stringify(customDishes)); }catch(e){} }
function allDishes(){ return DISHES.concat(customDishes); }

let savedPicks = [];
try{ savedPicks = JSON.parse(localStorage.getItem("familyRecipePicks")||"[]")||[]; }catch(e){}
let state = {
  region:"all", type:"all", spicy:"all", query:"",
  picked:new Set(savedPicks)
};
function savePicks(){ try{ localStorage.setItem("familyRecipePicks", JSON.stringify([...state.picked])); }catch(e){} }

const listEl = document.getElementById("list");
const pickCountEl = document.getElementById("pickCount");
const totalCntEl = document.getElementById("totalCnt");
const totalCnt2El = document.getElementById("totalCnt2");

function filterDishes(){
  return allDishes().filter(d=>{
    if(state.region!=="all" && d.region!==state.region) return false;
    if(state.type!=="all" && d.type!==state.type) return false;
    if(state.spicy!=="all" && d.spicy!==state.spicy) return false;
    if(state.query){
      const q = state.query.toLowerCase();
      const hit = d.cn.toLowerCase().includes(q) || d.en.toLowerCase().includes(q);
      if(!hit) return false;
    }
    return true;
  });
}

function render(){
  listEl.innerHTML = "";
  const visible = filterDishes();
  totalCntEl.textContent = allDishes().length;
  totalCnt2El.textContent = allDishes().length;
  if(visible.length===0){
    listEl.innerHTML = '<div class="empty">没有符合条件的菜，试试调整筛选条件～</div>';
    pickCountEl.textContent = state.picked.size;
    return;
  }
  // group by region preserving order
  const order = ["jiangzhe","shanghai","mindong","minnan","guangdong","hot","restaurant","soup"];
  const groups = {};
  visible.forEach(d=>{(groups[d.region]=groups[d.region]||[]).push(d);});
  order.forEach(reg=>{
    const arr = groups[reg];
    if(!arr) return;
    const pickedInGroup = arr.filter(d=>state.picked.has(d.cn)).length;
    const sec = document.createElement("section");
    sec.className = "region";
    const h = document.createElement("h2");
    h.innerHTML = `${REGION_META[reg].name} <span class="cnt">${REGION_META[reg].note}</span> <span class="pick">已选 ${pickedInGroup}/${arr.length}</span>`;
    const addBtn = document.createElement("button");
    addBtn.className = "addBtn";
    addBtn.textContent = "＋ 新增菜";
    addBtn.onclick = ()=>{ openModal(reg); };
    h.appendChild(addBtn);
    sec.appendChild(h);
    arr.forEach(d=>{
      const div = document.createElement("div");
      div.className = "dish"+(state.picked.has(d.cn)?" checked":"");
      let tags = `<span class="tag ${TYPE_CLASS[d.type]}">${d.type}</span>
        <span class="tag ${SPICY_CLASS[d.spicy]}">${d.spicy}</span>`;
      if(d.herbal) tags += `<span class="tag herbal">🌿 福建草本</span>`;
      if(d.benefit) tags += `<span class="tag benefit">${d.benefit}</span>`;
      let delBtn = "";
      if(d.custom) delBtn = `<button class="delBtn" title="删除这道自定义菜">×</button>`;
      div.innerHTML = `
        <div class="box">✓</div>
        <div class="name">${d.cn}</div>
        <div class="en">${d.en||"(英文名待补)"}</div>
        <div class="tags">${tags}</div>${delBtn}`;
      div.onclick = ()=>{ toggle(d.cn); };
      if(d.custom){
        div.querySelector(".delBtn").onclick = (e)=>{
          e.stopPropagation();
          if(!confirm(`确定删除「${d.cn}」吗？`)) return;
          customDishes = customDishes.filter(x=>x!==d);
          saveCustom();
          render();
        };
      }
      sec.appendChild(div);
    });
    listEl.appendChild(sec);
  });
  pickCountEl.textContent = state.picked.size;
}

function toggle(cn){
  if(state.picked.has(cn)) state.picked.delete(cn); else state.picked.add(cn);
  savePicks();
  render();
}

document.querySelectorAll(".pill").forEach(p=>{
  p.onclick = ()=>{
    document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
    p.classList.add("active");
    state.region = p.dataset.region;
    render();
  };
});

document.getElementById("typeFilter").onchange = e=>{ state.type=e.target.value; render(); };
document.getElementById("spicyFilter").onchange = e=>{ state.spicy=e.target.value; render(); };
document.getElementById("search").oninput = e=>{ state.query=e.target.value.trim(); render(); };

document.getElementById("clearBtn").onclick = ()=>{ state.picked.clear(); savePicks(); render(); };

document.getElementById("selectAllBtn").onclick = ()=>{
  const visible = filterDishes();
  visible.forEach(d=>state.picked.add(d.cn));
  savePicks();
  render();
};

document.getElementById("copyBtn").onclick = ()=>{
  if(state.picked.size===0){ alert("你还没有勾选任何菜哦～"); return; }
  const order = ["jiangzhe","shanghai","mindong","minnan","guangdong","hot","restaurant","soup"];
  const lines = [];
  lines.push(`我选好了 ${state.picked.size} 道菜，清单如下：`);
  order.forEach(reg=>{
    const arr = allDishes().filter(d=>d.region===reg && state.picked.has(d.cn));
    if(!arr.length) return;
    lines.push("");
    lines.push(`【${REGION_META[reg].name}】`);
    arr.forEach(d=>{
      let extra = "";
      if(d.herbal) extra += " · 福建草本";
      if(d.benefit) extra += ` · 功效:${d.benefit}`;
      if(d.custom) extra += " · 自定义";
      lines.push(`  ${d.cn}（${d.en||"英文名待补"}）· ${d.type} · ${d.spicy}${extra}`);
    });
  });
  const text = lines.join("\n");
  const ta = document.getElementById("outputText");
  ta.value = text;
  document.getElementById("outputArea").classList.add("show");
  ta.select();
  try{ navigator.clipboard.writeText(text).catch(()=>{}); }catch(e){}
  document.getElementById("outputArea").scrollIntoView({behavior:"smooth"});
};

// ===== 新增菜弹窗 =====
let modalRegion = "jiangzhe";
const overlay = document.getElementById("modalOverlay");

function openModal(reg){
  modalRegion = reg;
  document.getElementById("mCn").value = "";
  document.getElementById("mEn").value = "";
  document.getElementById("mType").value = (reg==="soup") ? "汤" : "炒菜";
  document.getElementById("mSpicy").value = "不辣";
  document.getElementById("mBenefit").value = "";
  overlay.classList.add("show");
  document.getElementById("mCn").focus();
}
function closeModal(){ overlay.classList.remove("show"); }

document.getElementById("mCancel").onclick = closeModal;
overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };

document.getElementById("mSave").onclick = ()=>{
  const cn = document.getElementById("mCn").value.trim();
  const en = document.getElementById("mEn").value.trim();
  const type = document.getElementById("mType").value;
  const spicy = document.getElementById("mSpicy").value;
  const benefit = document.getElementById("mBenefit").value.trim();
  if(!cn){ alert("请先填中文菜名～"); return; }
  const exists = allDishes().some(d=>d.cn===cn);
  if(exists){ alert(`「${cn}」已经在清单里了，不用重复添加～`); return; }
  const dish = {cn, en, type, spicy, region:modalRegion, benefit:benefit||undefined, custom:true};
  if(modalRegion==="soup" && !benefit) dish.benefit = "自定义功效待补";
  customDishes.push(dish);
  saveCustom();
  state.picked.add(cn);
  savePicks();
  state.region = modalRegion;
  document.querySelectorAll(".pill").forEach(x=>x.classList.toggle("active", x.dataset.region===modalRegion));
  closeModal();
  render();
  document.getElementById("list").scrollIntoView({behavior:"smooth"});
};

render();
</script>
